---
- name: Freeze protected services and prepare existing Beszel config sync
  hosts: desk_monitoring
  become: true
  gather_facts: true
  any_errors_fatal: true
  tasks:
    - ansible.builtin.include_role:
        name: desk_monitoring
        tasks_from: preflight
        public: true
    - ansible.builtin.assert:
        that:
          - desk_monitoring_sync_enabled | bool
          - desk_monitoring_sync_source in groups['desk_monitoring']
    - name: Build private replica membership
      ansible.builtin.set_fact:
        desk_monitoring_nodes: "{{ desk_monitoring_nodes | default({}) | combine({item: hostvars[item].cluster_ip}) }}"
      loop: "{{ groups['desk_monitoring'] | sort }}"
    - name: Prepare encrypted initial config and private sync trust exactly once
      ansible.builtin.command:
        argv: ["{{ ansible_playbook_python }}", scripts/create-monitoring-sync-secret.py, --root, "{{ playbook_dir }}", --source, "{{ desk_monitoring_sync_source }}", --management, "{{ hostvars[desk_monitoring_sync_source].ansible_host }}", --admin-email, "{{ desk_monitoring_auto_login_email }}"]
        chdir: "{{ playbook_dir }}"
      delegate_to: localhost
      become: false
      run_once: true
      register: desk_monitoring_initial_seed
      changed_when: desk_monitoring_initial_seed.stdout == 'created'
      when: not ansible_check_mode
    - name: Load ignored sync material without displaying it
      ansible.builtin.set_fact:
        desk_monitoring_sync_credentials: "{{ lookup('ansible.builtin.file', playbook_dir + '/secret/desk-monitoring-sync.json') | from_json }}"
      no_log: true
      when: not ansible_check_mode

- name: Install configuration replication and align initial credentials serially
  hosts: desk_monitoring
  become: true
  gather_facts: false
  serial: 1
  any_errors_fatal: true
  tasks:
    - ansible.builtin.include_role:
        name: desk_monitoring
        tasks_from: config-sync

- name: Expose only hubs serving the current shared monitoring configuration
  hosts: desk_monitoring
  become: true
  gather_facts: false
  serial: 1
  any_errors_fatal: true
  tasks:
    - ansible.builtin.include_role:
        name: desk_monitoring
        tasks_from: proxy

- name: Verify shared config coverage and unchanged DNS and Xiaozhi
  hosts: desk_monitoring
  become: true
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Require three hubs at the same applied revision
      ansible.builtin.uri:
        url: "http://{{ cluster_ip }}:8092/api/desk-config/status"
        use_proxy: false
        timeout: 4
      register: desk_monitoring_shared_state
      until: desk_monitoring_shared_state.status == 200 and desk_monitoring_shared_state.json.ready_nodes | length == 3
      retries: 15
      delay: 2
      changed_when: false
      when: not ansible_check_mode
    - name: Require protected process and non-monitoring configuration isolation
      ansible.builtin.command:
        argv: [/usr/bin/python3, '-c', "{{ lookup('ansible.builtin.file', playbook_dir + '/roles/desk_monitoring/files/monitoring_probe.py') }}", guard, --private, "{{ cluster_ip }}", --vip, "{{ desk_monitoring_vip }}", --after-proxy]
        stdin: "{{ desk_monitoring_snapshot | to_json }}"
      changed_when: false
      check_mode: false
