---
- name: Configure Desk Cluster
  hosts: deskboxes
  become: true
  gather_facts: false

  vars_files:
    - vars/vault.yml

  roles:
    - identity
    - network
    - access

- name: Harden Desk Cluster SSH
  hosts: deskboxes
  become: true
  gather_facts: false
  serial: 1

  roles:
    - ssh

- name: Deploy Desk Cluster Core NATS one node at a time
  hosts: deskboxes
  become: true
  gather_facts: true
  gather_subset:
    - min
  serial: 1
  any_errors_fatal: true

  vars_files:
    - vars/vault.yml

  roles:
    - nats

- name: Verify the complete Desk Core NATS cluster
  hosts: deskboxes
  become: true
  gather_facts: false

  tasks:
    - name: Run read-only verification after all NATS nodes are configured
      ansible.builtin.include_role:
        name: nats
        tasks_from: verify
      when: not ansible_check_mode

- name: Deploy standalone Xiaozhi workers one node at a time
  hosts: xiaozhi_workers
  become: true
  gather_facts: true
  gather_subset:
    - min
  serial: 1
  any_errors_fatal: true
  tags:
    - worker

  vars_files:
    - vars/vault.yml

  roles:
    - xiaozhi_worker
