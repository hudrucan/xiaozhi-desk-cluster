---
# Phase 3A: warm read lane first, validate fixed snapshots, then certified Core cutover.
# --tags workers runs only the compatible shadow worker rollout.
# --tags core requires already healthy owner snapshots. No vendor/control changes.
- name: Freeze protected services and require idle camera media
  hosts: deskboxes
  become: true
  gather_facts: false
  any_errors_fatal: true
  tags: [workers, core]
  tasks:
    - ansible.builtin.file:
        path: /var/lib/desk-camera/commands
        state: directory
        mode: '0700'
    - ansible.builtin.assert:
        that:
          - ansible_play_hosts_all | sort == ['deskb1x','deskb2x','deskb3x']
    - ansible.builtin.command:
        argv: [python3, '-c', "{{ lookup('file',playbook_dir+'/roles/desk_ui/files/ui_guard.py') }}", freeze]
      register: observations_guard
      changed_when: false
      no_log: true
    - ansible.builtin.uri:
        url: 'http://{{ cluster_ip }}:20223/status'
        use_proxy: false
      register: observations_before
    - ansible.builtin.assert:
        that:
          - observations_before.json.sync == 'synced'
          - observations_before.json.voter_ready
          - groups['deskboxes'] | map('extract',hostvars,'observations_before') | map(attribute='json') | selectattr('ready','equalto',true) | list | length == 1
    - ansible.builtin.command:
        argv:
          - python3
          - -c
          - |
            import json,socket
            with socket.socket(socket.AF_UNIX,socket.SOCK_STREAM) as s:
                s.settimeout(3);s.connect('/run/desk-camera-thumbnails/worker.sock')
                s.sendall(b'{"action":"status","id":"00000000000000000000000000000000"}\n')
                v=json.loads(s.makefile('rb').readline())['value']
                assert not v['busy'] and not v['media']['busy'], 'Media busy'
      changed_when: false

- name: Install compatible owner observation workers one node at a time
  hosts: deskboxes
  become: true
  gather_facts: false
  serial: 1
  any_errors_fatal: true
  tags: [workers]
  tasks:
    - ansible.builtin.copy:
        content: '{"version":1,"workloads":[]}'
        dest: /etc/desk-camera/recording-policy/observations.json
        mode: '0600'
        force: false
    - ansible.builtin.copy:
        src: 'roles/desk_camera/files/{{ item }}'
        dest: '/usr/local/libexec/desk-camera/{{ item }}'
        mode: '0600'
        backup: true
        validate: /usr/bin/python3 -c "import ast,sys; ast.parse(open(sys.argv[1]).read())" %s
      loop: [controller.py, transport.py, media_rpc.py, thumbnail_worker.py, observation_contract.py, observation_worker.py, command_contract.py, command_worker.py]
      register: observations_sources
    - ansible.builtin.copy:
        src: roles/desk_camera/files/thumbnail.service
        dest: /etc/systemd/system/desk-camera-thumbnails.service
        mode: '0644'
        backup: true
      register: observations_unit
    - ansible.builtin.systemd_service:
        name: desk-camera
        state: restarted
        daemon_reload: true
      when: observations_sources.changed or observations_unit.changed
    - ansible.builtin.uri:
        url: 'http://{{ cluster_ip }}:20226/status'
        use_proxy: false
      register: observations_voter
      until: observations_voter.json.voter_ready | default(false) and observations_voter.json.transport.connected | default(false)
      retries: 35
      delay: 2
    - ansible.builtin.command:
        argv:
          - python3
          - -c
          - |
            import json,socket
            with socket.socket(socket.AF_UNIX,socket.SOCK_STREAM) as s:
                s.settimeout(3);s.connect('/run/desk-camera-thumbnails/worker.sock')
                s.sendall(b'{"action":"status","id":"00000000000000000000000000000000"}\n')
                assert 'observations' in json.loads(s.makefile('rb').readline())['value']
      register: observations_warm
      until: observations_warm.rc == 0
      retries: 35
      delay: 2
      changed_when: false

- name: Arm bounded read-only snapshots and validate every owner through root IPC
  hosts: deskboxes
  become: true
  gather_facts: false
  any_errors_fatal: true
  tags: [workers, core]
  tasks:
    - ansible.builtin.copy:
        content: '{"version":1,"workloads":["tapo_c222_160","tapo_c222_161","tapo_c222_163"]}'
        dest: /etc/desk-camera/recording-policy/observations.json
        mode: '0600'
        backup: true
      when: "'workers' in ansible_run_tags or 'all' in ansible_run_tags"
    - name: Validate snapshots without exposing raw camera information
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - |
            import json,socket,sys,time
            sys.path.insert(0,'/usr/local/libexec/desk-camera')
            from observation_contract import snapshot,encoded
            for w in ('tapo_c222_160','tapo_c222_161','tapo_c222_163'):
                end=time.monotonic()+20
                while True:
                    with socket.socket(socket.AF_UNIX,socket.SOCK_STREAM) as s:
                        s.settimeout(4);s.connect('/run/desk-camera/bridge.sock')
                        s.sendall(encoded(dict(action='observation',workload=w,after=None))+b'\n')
                        result=json.loads(s.makefile('rb').readline(34000))
                    if result.get('ok') and result['value'].get('state')=='ready':
                        v=result['value'];snapshot(v,dict(version=1,workload=w,generation=v['generation'],after=None),time.time())
                        print(json.dumps(dict(workload=w,channels=v['channels'],methods=len(v['data']),bytes=len(encoded(v)))))
                        break
                    if time.monotonic()>end:raise ValueError('No healthy owner observation')
                    time.sleep(.4)
      register: observations_snapshots
      until: observations_snapshots.rc == 0
      retries: 3
      delay: 2
      changed_when: false

- name: Stage early Core adapter and root bridge
  hosts: deskboxes
  become: true
  gather_facts: false
  any_errors_fatal: true
  tags: [core]
  tasks:
    - ansible.builtin.copy:
        content: '{"version":1,"workloads":["tapo_c222_160","tapo_c222_161","tapo_c222_163"]}'
        dest: /etc/desk-camera/observation-core-policy.json
        mode: '0600'
        backup: true
    - ansible.builtin.copy:
        src: 'roles/desk_homeassistant/files/{{ item }}'
        dest: '/usr/local/libexec/desk-homeassistant/{{ item }}'
        mode: '0700'
        backup: true
        validate: /usr/bin/python3 -c "import ast,sys; ast.parse(open(sys.argv[1]).read())" %s
      loop: [ui_bridge.py, component_config.py, recording_bootstrap.py]
    - ansible.builtin.copy:
        src: 'roles/desk_homeassistant/files/desk_cluster/{{ item }}'
        dest: '/usr/local/libexec/desk-homeassistant/desk_cluster/{{ item }}'
        mode: '0644'
        backup: true
        validate: /usr/bin/python3 -c "import ast,sys; ast.parse(open(sys.argv[1]).read())" %s
      loop: [__init__.py, observation_remote.py, command_remote.py]
    - ansible.builtin.group_by:
        key: "observations_{{ 'core' if observations_before.json.ready else 'standby' }}"

- name: Load the new root bridge on standby agents first
  hosts: observations_standby
  become: true
  gather_facts: false
  serial: 1
  any_errors_fatal: true
  tags: [core]
  tasks:
    - ansible.builtin.systemd_service:
        name: desk-homeassistant
        state: restarted
    - ansible.builtin.uri:
        url: 'http://{{ cluster_ip }}:20223/status'
        use_proxy: false
      register: observations_standby_ready
      until: observations_standby_ready.json.voter_ready | default(false) and observations_standby_ready.json.sync | default('') == 'synced'
      retries: 35
      delay: 2

- name: Certify current local configuration and adapter through clean Core handoff
  hosts: observations_core
  become: true
  gather_facts: false
  any_errors_fatal: true
  tags: [core]
  tasks:
    - ansible.builtin.command:
        argv: [/opt/desk-homeassistant/bin/python, /usr/local/libexec/desk-homeassistant/agent.py, --action, handoff]
    - ansible.builtin.systemd_service:
        name: desk-homeassistant
        state: restarted

- name: Verify isolation and certified Core observation adapter
  hosts: deskboxes
  become: true
  gather_facts: false
  any_errors_fatal: true
  tags: [workers, core]
  tasks:
    - name: Require early owner polling adapter and synced recovery on all three nodes
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - |
            import json,urllib.request
            o=urllib.request.build_opener(urllib.request.ProxyHandler({}))
            ips=['10.10.10.'+str(i) for i in (11,12,13)]
            states=[json.load(o.open('http://'+ip+':20223/status',timeout=3)) for ip in ips]
            assert sum(s['ready'] for s in states)==1 and all(s['sync']=='synced' and s['voter_ready'] for s in states)
            assert len({s['checkpoint_revision'] for s in states})==1
            ip,s=next((ip,s) for ip,s in zip(ips,states) if s['ready'])
            assert s['error'] is None
            a=json.load(o.open('http://'+ip+':18123/api/desk_cluster/ready',timeout=3))['observation_authority']
            assert a['guarded'] and a['before_native_setup'] and len(a['workloads'])==3 and a['owner_reads']>=3
            print('Owner status polling, early adapter and certified recovery 3/3: PASS')
      when: "'core' in ansible_run_tags or 'all' in ansible_run_tags"
      register: observations_certified
      until: observations_certified.rc == 0
      retries: 90
      delay: 3
      changed_when: false
      run_once: true
    - ansible.builtin.command:
        argv: [python3, '-c', "{{ lookup('file',playbook_dir+'/roles/desk_ui/files/ui_guard.py') }}", guard]
        stdin: '{{ observations_guard.stdout }}'
      changed_when: false
      no_log: true
