---
- name: Update only the root dashboard page with protected runtime guards
  hosts: deskboxes
  become: true
  gather_facts: false
  serial: 1
  any_errors_fatal: true
  tasks:
    - name: Require an existing dashboard deployment
      ansible.builtin.assert:
        that: desk_dashboard_enabled | default(false) | bool
    - name: Freeze protected runtime and policy
      ansible.builtin.command:
        argv: [/usr/bin/python3, '-c', "{{ lookup('ansible.builtin.file', 'roles/desk_ui/files/ui_guard.py') }}", freeze]
      register: page_before
      changed_when: false
      no_log: true
    - name: Read installed public dashboard membership
      ansible.builtin.slurp:
        src: /etc/desk-dashboard/config.json
      register: applied_dashboard
    - name: Retain the installed dashboard membership
      ansible.builtin.set_fact:
        dashboard_members: "{{ (applied_dashboard.content | b64decode | from_json).members }}"
    - name: Retain the previous root page for rollback
      ansible.builtin.slurp:
        src: /etc/desk-ui/index.html
      register: old_page
      no_log: true
    - name: Render and validate the page without restarting collectors or services
      block:
        - name: Install root page
          ansible.builtin.template:
            src: roles/desk_ui/templates/index.html.j2
            dest: /etc/desk-ui/index.html
            mode: '0644'
          register: dashboard_page
        - name: Validate existing HTTP and MQTT routes and gracefully refresh the page
          ansible.builtin.command:
            argv: [/usr/bin/python3, /usr/local/libexec/desk-monitoring/install-proxy.py, --backend, /etc/desk-monitoring/backend.cfg, --dns-backend, /etc/desk-ui/backend.cfg, --dashboard-backend, /etc/desk-dashboard/backend.cfg, --reload-page]
          when: dashboard_page.changed
        - name: Verify unchanged protected services and configuration
          ansible.builtin.command:
            argv: [/usr/bin/python3, '-c', "{{ lookup('ansible.builtin.file', 'roles/desk_ui/files/ui_guard.py') }}", guard]
            stdin: "{{ page_before.stdout }}"
          changed_when: false
      rescue:
        - name: Restore the prior root page
          ansible.builtin.copy:
            content: "{{ old_page.content | b64decode }}"
            dest: /etc/desk-ui/index.html
            mode: '0644'
          no_log: true
        - name: Refresh the restored static page
          ansible.builtin.command:
            argv: [/usr/bin/python3, /usr/local/libexec/desk-monitoring/install-proxy.py, --backend, /etc/desk-monitoring/backend.cfg, --dns-backend, /etc/desk-ui/backend.cfg, --dashboard-backend, /etc/desk-dashboard/backend.cfg, --reload-page]
        - ansible.builtin.fail:
            msg: Dashboard page update failed; previous page restored.
