---
- ansible.builtin.include_tasks: guard.yml

- name: Report the non-mutating check-mode plan
  ansible.builtin.debug:
    msg: AdGuard candidates, downloads, packages and service changes are skipped in check mode. Real apply requires a bcrypt UI password hash.
  when: ansible_check_mode

- name: Prepare and activate the pinned AdGuard backend
  when: not ansible_check_mode
  block:
    - ansible.builtin.include_tasks: common.yml

    - name: Inspect the former mixed-case runtime configuration
      ansible.builtin.stat:
        path: /var/lib/desk-adguard/AdGuardHome.yaml
      register: desk_dns_legacy_config

    - name: Inspect the kebab-case runtime configuration
      ansible.builtin.stat:
        path: /var/lib/desk-adguard/adguard-home.yaml
      register: desk_dns_named_config

    - name: Reject ambiguous runtime configuration migration
      ansible.builtin.assert:
        that: not (desk_dns_legacy_config.stat.exists and desk_dns_named_config.stat.exists)
        fail_msg: Both runtime names exist. Preserve the live policy and resolve the duplicate before migration.

    - ansible.builtin.include_tasks: adguard-binary.yml

    - name: Render authenticated AdGuard candidate
      ansible.builtin.template:
        src: adguard-home.yaml.j2
        dest: /var/lib/desk-adguard/candidate.yaml
        owner: desk-adguard
        group: desk-adguard
        mode: '0600'
        validate: "/opt/desk-adguard/{{ desk_dns_adguard_version }}/adguard-home --check-config --no-check-update -w /var/lib/desk-adguard -c %s"
      no_log: true
      diff: false

    - name: Inspect an already configured policy sync account
      ansible.builtin.stat:
        path: /etc/desk-dns/sync-agent.json
      register: desk_dns_existing_sync

    - name: Preserve the automation account in a newly rendered base candidate
      ansible.builtin.command:
        argv: [/usr/bin/python3, /usr/local/libexec/desk-dns/dns-sync-account.py, inject, --path, /var/lib/desk-adguard/candidate.yaml]
      when: desk_dns_existing_sync.stat.exists
      no_log: true

    - name: Validate the base candidate with its preserved automation account
      ansible.builtin.command:
        argv: ["/opt/desk-adguard/{{ desk_dns_adguard_version }}/adguard-home", --check-config, --no-check-update, -w, /var/lib/desk-adguard, -c, /var/lib/desk-adguard/candidate.yaml]
      when: desk_dns_existing_sync.stat.exists
      changed_when: false
      no_log: true

    - name: Compute managed policy fingerprint without exposing the password hash
      ansible.builtin.set_fact:
        desk_dns_policy_digest: "{{ lookup('ansible.builtin.template', 'adguard-home.yaml.j2') | hash('sha256') }}"
      no_log: true

    - name: Read previous managed policy fingerprint
      ansible.builtin.slurp:
        src: /etc/desk-dns/policy.sha256
      register: desk_dns_old_policy
      failed_when: false
      changed_when: false
      no_log: true

    - name: Migrate the validated runtime name while preserving local policy
      when: desk_dns_legacy_config.stat.exists
      block:
        - name: Validate the retained policy before interrupting AdGuard
          ansible.builtin.command:
            argv: ["/opt/desk-adguard/{{ desk_dns_adguard_version }}/adguard-home", --check-config, --no-check-update, -w, /var/lib/desk-adguard, -c, /var/lib/desk-adguard/AdGuardHome.yaml]
          changed_when: false
          no_log: true
        - name: Stop only AdGuard before preserving its latest mutable configuration
          ansible.builtin.systemd_service:
            name: desk-adguard
            state: stopped
        - name: Move the existing policy without rendering or replacing its contents
          ansible.builtin.command:
            argv: [/usr/bin/mv, /var/lib/desk-adguard/AdGuardHome.yaml, /var/lib/desk-adguard/adguard-home.yaml]
            creates: /var/lib/desk-adguard/adguard-home.yaml
        - name: Install the renamed runtime unit with a rollback copy
          ansible.builtin.template:
            src: desk-adguard.service.j2
            dest: /etc/systemd/system/desk-adguard.service
            mode: '0644'
            backup: true
          register: desk_dns_migration_unit
        - name: Resume AdGuard using the renamed policy
          ansible.builtin.systemd_service:
            name: desk-adguard
            state: started
            daemon_reload: true
      rescue:
        - name: Restore the former runtime filename if it was moved
          ansible.builtin.command:
            argv: [/usr/bin/python3, '-c', "from pathlib import Path; old=Path('/var/lib/desk-adguard/AdGuardHome.yaml'); new=Path('/var/lib/desk-adguard/adguard-home.yaml'); new.rename(old) if new.exists() and not old.exists() else None"]
        - name: Restore the former service candidate
          ansible.builtin.copy:
            src: "{{ desk_dns_migration_unit.backup_file }}"
            dest: /etc/systemd/system/desk-adguard.service
            remote_src: true
            mode: '0644'
          when: desk_dns_migration_unit.backup_file | default('') | length > 0
        - name: Resume the preserved AdGuard service after failed migration
          ansible.builtin.systemd_service:
            name: desk-adguard
            state: started
            daemon_reload: true
        - name: Stop rollout after restoring the original runtime name
          ansible.builtin.fail:
            msg: Runtime filename migration failed; original policy and unit were restored.

    - name: Check installed AdGuard configuration
      ansible.builtin.stat:
        path: /var/lib/desk-adguard/adguard-home.yaml
      register: desk_dns_existing_config

    - name: Determine whether managed policy must be replaced
      ansible.builtin.set_fact:
        desk_dns_policy_changed: "{{ not desk_dns_existing_config.stat.exists or desk_dns_reconcile_policy or (desk_dns_old_policy.content | default('') | b64decode | trim) != desk_dns_policy_digest }}"

    - name: Validate installed DNS policy if retaining local UI changes
      ansible.builtin.command:
        argv:
          - "/opt/desk-adguard/{{ desk_dns_adguard_version }}/adguard-home"
          - --check-config
          - --no-check-update
          - -w
          - /var/lib/desk-adguard
          - -c
          - /var/lib/desk-adguard/adguard-home.yaml
      changed_when: false
      no_log: true
      when: not desk_dns_policy_changed

    - name: Install isolated AdGuard unit
      ansible.builtin.template:
        src: desk-adguard.service.j2
        dest: /etc/systemd/system/desk-adguard.service
        mode: '0644'
      register: desk_dns_adguard_unit

    - name: Stop only AdGuard before replacing its mutable YAML
      ansible.builtin.systemd_service:
        name: desk-adguard
        state: stopped
        daemon_reload: true
      when: desk_dns_policy_changed

    - name: Install already validated policy
      ansible.builtin.copy:
        src: /var/lib/desk-adguard/candidate.yaml
        dest: /var/lib/desk-adguard/adguard-home.yaml
        remote_src: true
        owner: desk-adguard
        group: desk-adguard
        mode: '0600'
        backup: true
      no_log: true
      diff: false
      when: desk_dns_policy_changed

    - name: Record applied managed policy fingerprint
      ansible.builtin.copy:
        content: "{{ desk_dns_policy_digest }}\n"
        dest: /etc/desk-dns/policy.sha256
        owner: root
        group: root
        mode: '0600'

    - name: Start or restart only the dedicated AdGuard unit
      ansible.builtin.systemd_service:
        name: desk-adguard
        state: "{{ 'restarted' if desk_dns_adguard_unit.changed else 'started' }}"
        enabled: true
        daemon_reload: true

    - name: Require the local AdGuard identity, filtering and UDP/TCP answers
      ansible.builtin.command:
        argv: [/usr/bin/python3, /usr/local/libexec/desk-dns/dns-probe.py, backend, --config, /etc/desk-dns/public.json, --host, "{{ cluster_ip }}", --port, "{{ desk_dns_backend_port | string }}"]
      register: desk_dns_backend_ready
      until: desk_dns_backend_ready.rc == 0
      retries: 5
      delay: 2
      changed_when: false

    - name: Install isolated passive DNS activity unit
      ansible.builtin.template:
        src: desk-dns-activity.service.j2
        dest: /etc/systemd/system/desk-dns-activity.service
        owner: root
        group: root
        mode: '0644'
      register: desk_dns_activity_unit

    - name: Start or restart only the DNS activity collector
      ansible.builtin.systemd_service:
        name: desk-dns-activity
        state: "{{ 'restarted' if desk_dns_activity_script.changed or desk_dns_activity_unit.changed else 'started' }}"
        enabled: true
        daemon_reload: true
