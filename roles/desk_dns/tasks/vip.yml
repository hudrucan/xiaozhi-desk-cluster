---
- ansible.builtin.include_tasks: guard.yml

- name: Activate independent VRRP only after all-node DNS verification
  when: not ansible_check_mode
  block:
    - ansible.builtin.include_tasks: check_backends.yml

    - name: Recheck every frontend before changing DNS VIP ownership
      ansible.builtin.command:
        argv: [/usr/bin/python3, /usr/local/libexec/desk-dns/dns-probe.py, balanced, --config, /etc/desk-dns/public.json, --host, "{{ desk_dns_nodes[item].management }}", --port, "{{ desk_dns_test_port | string }}"]
      loop: "{{ groups['desk_dns'] | sort }}"
      changed_when: false

    - name: Install native readiness probes before referencing them in VRRP
      ansible.builtin.include_role:
        name: desk_healthcheck

    - name: Validate independent Keepalived candidate without starting it
      ansible.builtin.template:
        src: keepalived.conf.j2
        dest: /etc/desk-dns/keepalived.conf
        owner: root
        group: root
        mode: '0644'
        validate: /usr/sbin/keepalived --config-test --use-file=%s
      register: desk_dns_vrrp_config

    - name: Install dedicated VRRP unit with independent PIDs
      ansible.builtin.template:
        src: desk-dns-vip.service.j2
        dest: /etc/systemd/system/desk-dns-vip.service
        mode: '0644'
      register: desk_dns_vrrp_unit

    - name: Install owner-only DNS ARP metadata and units
      ansible.builtin.include_tasks: peer_arp.yml

    - name: Start or restart only DNS Keepalived after verification passed
      ansible.builtin.systemd_service:
        name: desk-dns-vip
        state: "{{ 'restarted' if desk_dns_vrrp_config.changed or desk_dns_vrrp_unit.changed else 'started' }}"
        enabled: true
        daemon_reload: true

    - name: Activate only the DNS peer announcement timer
      ansible.builtin.systemd_service:
        name: desk-dns-peer-arp.timer
        state: started
        enabled: true
        daemon_reload: true
