---
- name: Validate control-plane inputs before host mutations
  ansible.builtin.include_tasks: preflight.yml

- name: Converge control-plane prerequisites, pinned source and private runtime state
  when: not ansible_check_mode
  block:
    - name: Install only control-plane deployment prerequisites
      ansible.builtin.apt:
        name: [git, python3, python3-venv, python3-packaging, ca-certificates, libopus0]
        state: present
        install_recommends: false
        update_cache: true
        cache_valid_time: 3600

    - name: Create the control-plane system group
      ansible.builtin.group:
        name: "{{ xiaozhi_control_plane_service_user }}"
        system: true

    - name: Create the unprivileged control-plane system user without login or home
      ansible.builtin.user:
        name: "{{ xiaozhi_control_plane_service_user }}"
        group: "{{ xiaozhi_control_plane_service_user }}"
        system: true
        shell: /usr/sbin/nologin
        home: /nonexistent
        create_home: false

    - name: Create the root-owned control-plane installation directory
      ansible.builtin.file:
        path: "{{ xiaozhi_control_plane_root }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Check out the exact control-plane source revision as root
      ansible.builtin.git:
        repo: "{{ xiaozhi_control_plane_repo_url }}"
        dest: "{{ xiaozhi_control_plane_repo_dir }}"
        version: "{{ xiaozhi_control_plane_revision }}"
        update: true
        force: false
        recursive: false
        umask: "0022"
      environment:
        GIT_TERMINAL_PROMPT: "0"
      notify: Restart Xiaozhi control plane

    - name: Install only control-plane requirements into its dedicated root-owned venv
      ansible.builtin.pip:
        requirements: "{{ xiaozhi_control_plane_repo_dir }}/main/xiaozhi-server/requirements-control-plane.txt"
        virtualenv: "{{ xiaozhi_control_plane_venv_dir }}"
        virtualenv_command: /usr/bin/python3 -m venv
        virtualenv_site_packages: false
        state: present
        umask: "0022"
      environment:
        PIP_DISABLE_PIP_VERSION_CHECK: "1"
      notify: Restart Xiaozhi control plane

    - name: Create the root-managed data and private credential directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: "{{ xiaozhi_control_plane_service_user }}"
        mode: "0750"
      loop:
        - "{{ xiaozhi_control_plane_repo_dir }}/main/xiaozhi-server/data"
        - /etc/xiaozhi-control-plane

    - name: Give the service only its required cache and local-secret write directories
      ansible.builtin.file:
        path: "{{ xiaozhi_control_plane_repo_dir }}/main/xiaozhi-server/data/{{ item }}"
        state: directory
        owner: "{{ xiaozhi_control_plane_service_user }}"
        group: "{{ xiaozhi_control_plane_service_user }}"
        mode: "0700"
      loop: [cloud-config, node-secrets, cloud-soundbank]

    - name: Install private Drive credentials readable only by root and the service
      ansible.builtin.copy:
        content: "{{ xiaozhi_control_plane_credentials_content }}"
        dest: /etc/xiaozhi-control-plane/drive-credentials.json
        owner: root
        group: "{{ xiaozhi_control_plane_service_user }}"
        mode: "0640"
      no_log: true
      diff: false
      notify: Restart Xiaozhi control plane

    - name: Install the node bootstrap pointing at the shared Cloud authority
      ansible.builtin.copy:
        content: "{{ xiaozhi_control_plane_bootstrap_content }}"
        dest: "{{ xiaozhi_control_plane_repo_dir }}/main/xiaozhi-server/data/bootstrap.yaml"
        owner: root
        group: "{{ xiaozhi_control_plane_service_user }}"
        mode: "0640"
      no_log: true
      diff: false
      notify: Restart Xiaozhi control plane

- name: Report control-plane desired state during check mode
  ansible.builtin.debug:
    msg: "{{ inventory_hostname }} would run the pinned control plane {{ xiaozhi_control_plane_revision }} on {{ cluster_ip }}:{{ xiaozhi_control_plane_port }}. Private bootstrap/credential templates were rendered without displaying values; source/venv/data writes and live probes are skipped."
  when: ansible_check_mode

- name: Render the root-only environment with existing NATS credentials
  ansible.builtin.template:
    src: xiaozhi-control-plane.env.j2
    dest: /etc/xiaozhi-control-plane.env
    owner: root
    group: root
    mode: "0600"
  no_log: true
  diff: false
  notify: Restart Xiaozhi control plane

- name: Install the standalone control-plane systemd unit
  ansible.builtin.template:
    src: xiaozhi-control-plane.service.j2
    dest: /etc/systemd/system/xiaozhi-control-plane.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload control-plane systemd units
    - Restart Xiaozhi control plane

- name: Apply material control-plane changes before local readiness verification
  ansible.builtin.meta: flush_handlers

- name: Keep the control plane enabled and started without restarting unchanged state
  ansible.builtin.systemd_service:
    name: xiaozhi-control-plane
    enabled: true
    state: started
  when: not ansible_check_mode

- name: Verify the local control plane over its private backend address
  ansible.builtin.include_tasks: verify.yml
  when: not ansible_check_mode
