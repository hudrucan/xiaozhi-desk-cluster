---
- name: Read shared NATS public defaults without deploying NATS
  ansible.builtin.include_vars:
    file: "{{ role_path }}/../nats/defaults/main.yml"
    name: xiaozhi_control_plane_nats_defaults

- name: Use the existing NATS application username unless overridden
  ansible.builtin.set_fact:
    nats_client_user: "{{ xiaozhi_control_plane_nats_defaults.nats_client_user }}"
  when: nats_client_user is not defined

- name: Use the existing NATS client port unless overridden
  ansible.builtin.set_fact:
    nats_client_port: "{{ xiaozhi_control_plane_nats_defaults.nats_client_port }}"
  when: nats_client_port is not defined

- name: Validate control-plane membership, platform and pinned source
  ansible.builtin.assert:
    that:
      - groups.get('xiaozhi_control_planes', []) | sort == ['deskb1x', 'deskb2x', 'deskb3x']
      - groups.get('deskboxes', []) | sort == ['deskb1x', 'deskb2x', 'deskb3x']
      - ansible_play_hosts_all | sort == groups['xiaozhi_control_planes'] | sort
      - inventory_hostname in groups['xiaozhi_control_planes']
      - inventory_hostname in groups['deskboxes']
      - cluster_ip is defined
      - cluster_interface == 'end0'
      - ansible_facts.os_family == 'Debian'
      - ansible_facts.architecture in ['aarch64', 'arm64']
      - ansible_facts.python.version.major == 3
      - ansible_facts.python.version.minor == 11
      - xiaozhi_control_plane_revision is string and xiaozhi_control_plane_revision is match('^[0-9a-f]{40}$')
      - xiaozhi_control_plane_root is match('^/opt/[A-Za-z0-9_-]+(?:/[A-Za-z0-9_-]+)*$')
      - xiaozhi_control_plane_repo_dir == xiaozhi_control_plane_root ~ '/repo'
      - xiaozhi_control_plane_venv_dir == xiaozhi_control_plane_root ~ '/venv'
      - xiaozhi_control_plane_service_user is match('^[a-z_][a-z0-9_-]*$') and xiaozhi_control_plane_service_user != 'root'
      - xiaozhi_control_plane_port | int > 0 and xiaozhi_control_plane_port | int < 65536
      - xiaozhi_control_plane_reconcile_seconds | float >= 1 and xiaozhi_control_plane_reconcile_seconds | float <= 3600
      - nats_client_user is string and nats_client_user | trim | length > 0
      - nats_client_port | int > 0 and nats_client_port | int < 65536
    fail_msg: Select all three explicit control-plane deskboxes with private end0 addresses, Debian ARM64 Python 3.11, a full Git SHA and valid managed /opt paths.

- name: Validate every private NATS and control-plane backend address
  ansible.builtin.assert:
    that:
      - hostvars[item].cluster_ip is defined
      - hostvars[item].cluster_ip is string
      - hostvars[item].cluster_ip is match('^10\.10\.10\.(?:[1-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-4])$')
    fail_msg: Every deskbox requires a private 10.10.10.0/24 cluster_ip; management addresses are not backends.
  loop: "{{ groups['deskboxes'] | sort }}"

- name: Require three distinct private backend addresses
  ansible.builtin.assert:
    that:
      - groups['deskboxes'] | map('extract', hostvars, 'cluster_ip') | unique | list | length == 3

- name: Require existing NATS credentials and shared private Cloud bootstrap values
  ansible.builtin.assert:
    that:
      - vault_nats_client_password is defined
      - vault_nats_client_password is string and vault_nats_client_password | trim | length > 0
      - nats_client_password is defined
      - nats_client_password is string and nats_client_password == vault_nats_client_password
      - nats_client_password is not search('\x00')
      - nats_client_user is not search('\x00')
      - vault_xiaozhi_cloud_folder_id is defined
      - vault_xiaozhi_cloud_folder_id is string and vault_xiaozhi_cloud_folder_id is match('^[A-Za-z0-9_-]+$')
      - vault_xiaozhi_cloud_manifest_file_id is defined
      - vault_xiaozhi_cloud_manifest_file_id is string and vault_xiaozhi_cloud_manifest_file_id is match('^[A-Za-z0-9_-]+$')
      - vault_xiaozhi_cloud_credentials is defined
      - vault_xiaozhi_cloud_credentials is mapping and vault_xiaozhi_cloud_credentials | length > 0
      - vault_xiaozhi_cloud_memory_manifest_file_id is not defined or (vault_xiaozhi_cloud_memory_manifest_file_id is string and vault_xiaozhi_cloud_memory_manifest_file_id is match('^[A-Za-z0-9_-]+$'))
    quiet: true
    fail_msg: Populate the existing encrypted Vault with matching NATS credentials, Cloud authority IDs and a credential mapping; optional Memory must be a valid ID.
  no_log: true

- name: Derive the NATS server list from existing sorted deskbox addresses
  ansible.builtin.set_fact:
    xiaozhi_control_plane_nats_servers: "nats://{{ groups['deskboxes'] | sort | map('extract', hostvars, 'cluster_ip') | join(':' ~ (nats_client_port | string) ~ ',nats://') }}:{{ nats_client_port }}"

# Render even on first-install --check, when target parent directories do not
# exist. Apply writes these reviewed contents only after creating prerequisites.
- name: Render private Cloud deployment candidates without displaying values
  ansible.builtin.set_fact:
    xiaozhi_control_plane_credentials_content: "{{ lookup('ansible.builtin.template', 'drive-credentials.json.j2') }}"
    xiaozhi_control_plane_bootstrap_content: "{{ lookup('ansible.builtin.template', 'bootstrap.yaml.j2') }}"
  no_log: true
  diff: false

- name: Converge control-plane prerequisites, pinned source and private runtime state
  when: not ansible_check_mode
  block:
    - name: Install only control-plane deployment prerequisites
      ansible.builtin.apt:
        name: [git, python3, python3-venv, python3-packaging, ca-certificates, libopus0]
        state: present
        install_recommends: false
        update_cache: true
        cache_valid_time: 3600

    - name: Create the control-plane system group
      ansible.builtin.group:
        name: "{{ xiaozhi_control_plane_service_user }}"
        system: true

    - name: Create the unprivileged control-plane system user without login or home
      ansible.builtin.user:
        name: "{{ xiaozhi_control_plane_service_user }}"
        group: "{{ xiaozhi_control_plane_service_user }}"
        system: true
        shell: /usr/sbin/nologin
        home: /nonexistent
        create_home: false

    - name: Create the root-owned control-plane installation directory
      ansible.builtin.file:
        path: "{{ xiaozhi_control_plane_root }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Check out the exact control-plane source revision as root
      ansible.builtin.git:
        repo: "{{ xiaozhi_control_plane_repo_url }}"
        dest: "{{ xiaozhi_control_plane_repo_dir }}"
        version: "{{ xiaozhi_control_plane_revision }}"
        update: true
        force: false
        recursive: false
        umask: "0022"
      environment:
        GIT_TERMINAL_PROMPT: "0"
      notify: Restart Xiaozhi control plane

    - name: Install only control-plane requirements into its dedicated root-owned venv
      ansible.builtin.pip:
        requirements: "{{ xiaozhi_control_plane_repo_dir }}/main/xiaozhi-server/requirements-control-plane.txt"
        virtualenv: "{{ xiaozhi_control_plane_venv_dir }}"
        virtualenv_command: /usr/bin/python3 -m venv
        virtualenv_site_packages: false
        state: present
        umask: "0022"
      environment:
        PIP_DISABLE_PIP_VERSION_CHECK: "1"
      notify: Restart Xiaozhi control plane

    - name: Create the root-managed data and private credential directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: "{{ xiaozhi_control_plane_service_user }}"
        mode: "0750"
      loop:
        - "{{ xiaozhi_control_plane_repo_dir }}/main/xiaozhi-server/data"
        - /etc/xiaozhi-control-plane

    - name: Give the service only its required cache and local-secret write directories
      ansible.builtin.file:
        path: "{{ xiaozhi_control_plane_repo_dir }}/main/xiaozhi-server/data/{{ item }}"
        state: directory
        owner: "{{ xiaozhi_control_plane_service_user }}"
        group: "{{ xiaozhi_control_plane_service_user }}"
        mode: "0700"
      loop: [cloud-config, node-secrets, cloud-soundbank]

    - name: Install private Drive credentials readable only by root and the service
      ansible.builtin.copy:
        content: "{{ xiaozhi_control_plane_credentials_content }}"
        dest: /etc/xiaozhi-control-plane/drive-credentials.json
        owner: root
        group: "{{ xiaozhi_control_plane_service_user }}"
        mode: "0640"
      no_log: true
      diff: false
      notify: Restart Xiaozhi control plane

    - name: Install the node bootstrap pointing at the shared Cloud authority
      ansible.builtin.copy:
        content: "{{ xiaozhi_control_plane_bootstrap_content }}"
        dest: "{{ xiaozhi_control_plane_repo_dir }}/main/xiaozhi-server/data/bootstrap.yaml"
        owner: root
        group: "{{ xiaozhi_control_plane_service_user }}"
        mode: "0640"
      no_log: true
      diff: false
      notify: Restart Xiaozhi control plane

- name: Report control-plane desired state during check mode
  ansible.builtin.debug:
    msg: "{{ inventory_hostname }} would run the pinned control plane {{ xiaozhi_control_plane_revision }} on {{ cluster_ip }}:{{ xiaozhi_control_plane_port }}. Private bootstrap/credential templates were rendered without displaying values; source/venv/data writes and live probes are skipped."
  when: ansible_check_mode

- name: Render the root-only environment with existing NATS credentials
  ansible.builtin.template:
    src: xiaozhi-control-plane.env.j2
    dest: /etc/xiaozhi-control-plane.env
    owner: root
    group: root
    mode: "0600"
  no_log: true
  diff: false
  notify: Restart Xiaozhi control plane

- name: Install the standalone control-plane systemd unit
  ansible.builtin.template:
    src: xiaozhi-control-plane.service.j2
    dest: /etc/systemd/system/xiaozhi-control-plane.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload control-plane systemd units
    - Restart Xiaozhi control plane

- name: Apply material control-plane changes before local readiness verification
  ansible.builtin.meta: flush_handlers

- name: Keep the control plane enabled and started without restarting unchanged state
  ansible.builtin.systemd_service:
    name: xiaozhi-control-plane
    enabled: true
    state: started
  when: not ansible_check_mode

- name: Verify the local control plane over its private backend address
  ansible.builtin.include_tasks: verify.yml
  when: not ansible_check_mode
