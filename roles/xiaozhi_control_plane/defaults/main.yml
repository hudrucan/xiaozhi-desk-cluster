---
xiaozhi_control_plane_repo_url: https://github.com/hudrucan/xiaozhi-desk-robot-server.git
xiaozhi_control_plane_revision: 9c86a30501a2051cb9852aa63c4a49c54a16dd65
xiaozhi_control_plane_root: /opt/xiaozhi-control-plane
xiaozhi_control_plane_repo_dir: "{{ xiaozhi_control_plane_root }}/repo"
xiaozhi_control_plane_venv_dir: "{{ xiaozhi_control_plane_root }}/venv"
xiaozhi_control_plane_service_user: xiaozhi-control-plane
xiaozhi_control_plane_port: 8004
xiaozhi_control_plane_reconcile_seconds: 45
xiaozhi_control_plane_verify_retries: 30
xiaozhi_control_plane_verify_delay: 2

# Opt-in all-node API key provisioning; the transfer key belongs in encrypted Vault.
xiaozhi_control_plane_secret_provisioning: false

# Opt-in for existing three-node ASR/LLM/TTS deployments only.
xiaozhi_control_plane_runtime_apply: false
xiaozhi_runtime_core_port: 8000

# Lightweight firmware MQTT bootstrap, using the applied Cloud VIP snapshot.
xiaozhi_control_plane_mqtt_bootstrap: false
xiaozhi_bootstrap_mqtt_port: 1883
xiaozhi_bootstrap_allowed_devices: []
