---
- ansible.builtin.assert:
    that:
      - desk_camera_enabled | bool
      - ansible_play_hosts_all | sort == ['deskb1x','deskb2x','deskb3x']
- name: Preserve existing protected service baseline
  ansible.builtin.command:
    argv: [python3, '-c', "{{ lookup('file',desk_repo_root+'/roles/desk_ui/files/ui_guard.py') }}", freeze]
  register: camera_guard
  changed_when: false
  no_log: true
- ansible.builtin.file:
    path: '{{ item }}'
    state: directory
    mode: '0700'
  loop: [/etc/desk-camera, /etc/desk-camera/recording-policy, /var/lib/desk-camera, /var/lib/desk-camera/deps, /var/lib/desk-camera/commands, /var/lib/desk-camera/playback, /var/lib/desk-camera/cache/hot, /var/lib/desk-camera/cache/cold, /usr/local/libexec/desk-camera/components]
- name: Seed inactive worker authority only; cutover uses playbooks/camera/camera-recording-owner.yml
  ansible.builtin.copy:
    content: '{"version":1,"workloads":[]}'
    dest: /etc/desk-camera/recording-policy/owner.json
    force: false
    mode: '0600'
- name: Seed desired Core guard on a new node without changing active authority
  ansible.builtin.copy:
    content: '{{ {"version":1,"workloads":desk_camera_recording_owner_workloads | default([])} | to_json }}'
    dest: /etc/desk-camera/recording-core-policy.json
    force: false
    mode: '0600'
- name: Seed read-only observation policy on new nodes; active changes use playbooks/camera/camera-observations.yml
  ansible.builtin.copy:
    content: '{{ {"version":1,"workloads":desk_camera_observation_workloads | default([])} | to_json }}'
    dest: '{{ item }}'
    force: false
    mode: '0600'
  loop: [/etc/desk-camera/recording-policy/observations.json, /etc/desk-camera/observation-core-policy.json]
- name: Seed inactive command writes; dedicated rollout installs the Core guard first
  ansible.builtin.copy:
    content: '{"version":1,"workloads":[]}'
    dest: /etc/desk-camera/recording-policy/commands.json
    force: false
    mode: '0600'
- name: Seed desired Core command guard on new nodes
  ansible.builtin.copy:
    content: '{{ {"version":1,"workloads":desk_camera_command_workloads | default([])} | to_json }}'
    dest: /etc/desk-camera/command-core-policy.json
    force: false
    mode: '0600'
- ansible.builtin.copy:
    src: '{{ desk_repo_root }}/secret/camera/{{ inventory_hostname }}.json'
    dest: /etc/desk-camera/config.json
    mode: '0600'
  no_log: true
  register: camera_definition
- name: Set progressive playback for configured cameras
  ansible.builtin.command:
    argv: [python3, -c, "import json,pathlib; p=pathlib.Path('/etc/desk-camera/config.json'); v=json.loads(p.read_bytes()); desired={{ desk_camera_progressive | bool | ternary('True','False') }}; changed=any(c.get('progressive',False)!=desired for c in v['cameras']); [c.update(progressive=desired) for c in v['cameras']]; q=p.with_suffix('.candidate'); q.write_text(json.dumps(v)) if changed else None; q.chmod(0o600) if changed else None; q.replace(p) if changed else None; print('changed' if changed else 'unchanged')"]
  register: camera_progressive
  changed_when: camera_progressive.stdout == 'changed'
  no_log: true
- ansible.builtin.copy:
    src: '{{ desk_repo_root }}/secret/camera/{{ item }}'
    dest: '/etc/desk-camera/{{ item }}'
    mode: '0600'
  loop: [nats-users.json, proxy.cfg, core-migration.json, playback.json]
  no_log: true
  register: camera_private
- ansible.builtin.copy:
    src: '{{ desk_repo_root }}/secret/camera/core-additions.json'
    dest: /etc/desk-camera/core-additions.json
    mode: '0600'
  when: lookup('fileglob', desk_repo_root+'/secret/camera/core-additions.json') | length > 0
  no_log: true
- ansible.builtin.copy:
    src: '{{ item }}'
    dest: '/usr/local/libexec/desk-camera/{{ item }}'
    mode: '0600'
  loop: [controller.py, transport.py, runtime.py, install_nats.py, health.py, playback.py, playback_worker.py, hls_worker.py, hls_files.py, thumbnail_decode.py, thumbnail_fetch.py, thumbnail_worker.py, warm_playback.py, media_rpc.py, cache_gc.py, recording_contract.py, recording_jobs.py, recording_owner.py, media_delivery.py, observation_contract.py, observation_worker.py, command_contract.py, command_worker.py]
  register: camera_helpers
- ansible.builtin.unarchive:
    src: components.tgz
    dest: /usr/local/libexec/desk-camera/components
    owner: root
    group: root
    mode: 'u=rwX,go='
- ansible.builtin.copy:
    src: camera_config.py
    dest: /usr/local/libexec/desk-homeassistant/camera_config.py
    mode: '0600'
- name: Reuse the approved pinned ARM64 relay image
  ansible.builtin.command:
    argv: [podman, pull, --quiet, '{{ desk_camera_relay_image }}']
  changed_when: false
- name: Install only pinned additional wheels outside HA config
  ansible.builtin.command:
    argv: [podman, run, --rm, --pull=never, --network=bridge, --cpus=1, --memory=512m, --cap-drop=ALL, --read-only, '--tmpfs=/tmp:size=64m', '-v', '/var/lib/desk-camera/deps:/deps:rw', --entrypoint=python3, '{{ desk_camera_core_image }}', -m, pip, install, --target, /deps, '--only-binary=:all:', --no-deps, --no-compile, pytapo==3.4.26, rtp==0.0.4]
    creates: /var/lib/desk-camera/deps/pytapo-3.4.26.dist-info/METADATA
- ansible.builtin.command:
    argv: [python3, /usr/local/libexec/desk-camera/install_nats.py]
  register: camera_nats
  changed_when: camera_nats.stdout == 'changed'
  no_log: true
- ansible.builtin.command:
    argv: [haproxy, -c, -f, /etc/desk-camera/proxy.cfg]
  changed_when: false
- ansible.builtin.copy:
    src: '{{ item.src }}'
    dest: '/etc/systemd/system/{{ item.name }}'
    mode: '0644'
  loop:
    - {src: controller.service, name: desk-camera.service}
    - {src: runtime.service, name: desk-camera-relay.service}
    - {src: thumbnail.service, name: desk-camera-thumbnails.service}
    - {src: proxy.service, name: desk-camera-proxy.service}
  register: camera_units
- ansible.builtin.systemd_service:
    daemon_reload: true
- ansible.builtin.systemd_service:
    name: '{{ item }}'
    enabled: true
    state: "{{ 'restarted' if camera_definition.changed or camera_progressive.changed or camera_private.changed or camera_helpers.changed or camera_units.changed else 'started' }}"
  loop: [desk-camera, desk-camera-relay, desk-camera-proxy, desk-camera-thumbnails]
- name: Wait for this voter before updating another node
  ansible.builtin.uri:
    url: 'http://{{ cluster_ip }}:20226/status'
    use_proxy: false
    timeout: 3
  register: camera_voter
  until: camera_voter.json.voter_ready
  retries: 25
  delay: 2
- name: Wait for preloaded media SDK before accepting playback
  ansible.builtin.command:
    argv: [python3, -c, "import socket,json; s=socket.socket(socket.AF_UNIX,socket.SOCK_STREAM); s.settimeout(3); s.connect('/run/desk-camera-thumbnails/worker.sock'); s.sendall(json.dumps({'action':'status','id':'0'*32}).encode()+bytes([10])); v=json.loads(s.makefile('rb').readline()); assert v['ok'] and 'media' in v['value']; s.close()"]
  register: camera_media_ready
  changed_when: false
  until: camera_media_ready.rc == 0
  retries: 40
  delay: 2
- name: Verify protected services remain available
  ansible.builtin.command:
    argv: [python3, '-c', "{{ lookup('file',desk_repo_root+'/roles/desk_ui/files/ui_guard.py') }}", guard]
    stdin: '{{ camera_guard.stdout }}'
  changed_when: false
  no_log: true
