---
- name: Resolve the source-addressed native dashboard artifact
  ansible.builtin.set_fact:
    dashboard_artifact: "/private/tmp/desk-dashboard-build/{{ lookup('ansible.builtin.file', playbook_dir + '/roles/desk_dashboard/files/dashboard.go') | hash('sha256') }}/desk-dashboard"
- name: Create the controller artifact cache
  ansible.builtin.file:
    path: "{{ dashboard_artifact | dirname }}"
    state: directory
    mode: '0755'
  delegate_to: localhost
  become: false
- name: Build the standard-library-only ARM64 dashboard on the controller
  ansible.builtin.command:
    argv: [go, build, -trimpath, -ldflags, '-s -w -buildid=', -o, "{{ dashboard_artifact }}", "{{ playbook_dir }}/roles/desk_dashboard/files/dashboard.go"]
    creates: "{{ dashboard_artifact }}"
  environment:
    GOOS: linux
    GOARCH: arm64
    CGO_ENABLED: '0'
    GO111MODULE: 'off'
    GOTOOLCHAIN: local
    GOCACHE: /private/tmp/desk-dashboard-go-cache
  delegate_to: localhost
  become: false
