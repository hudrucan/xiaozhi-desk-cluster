---
- name: Validate core inputs before mutation
  ansible.builtin.include_tasks: preflight.yml

- name: Preview the transport core without host mutations
  when: ansible_check_mode
  block:
    - name: Render the public service candidate
      ansible.builtin.set_fact:
        xiaozhi_core_unit_candidate: "{{ lookup('ansible.builtin.template', 'core.service.j2') }}"
    - name: Render the private environment without displaying it
      ansible.builtin.set_fact:
        xiaozhi_core_env_candidate: "{{ lookup('ansible.builtin.template', 'core.env.j2') }}"
      no_log: true

- name: Install transport core only during apply
  when: not ansible_check_mode
  block:
    - name: Install minimal source and Python deployment prerequisites
      ansible.builtin.apt:
        name: "{{ ['git', 'python3', 'python3-venv', 'ca-certificates'] + (['libopus0', 'ffmpeg'] if xiaozhi_core_tts_enabled else []) }}"
        state: present
        install_recommends: false
        update_cache: true
        cache_valid_time: 3600
    - name: Create the core system group
      ansible.builtin.group:
        name: "{{ xiaozhi_core_service_user }}"
        system: true
    - name: Create the unprivileged core user
      ansible.builtin.user:
        name: "{{ xiaozhi_core_service_user }}"
        group: "{{ xiaozhi_core_service_user }}"
        system: true
        shell: /usr/sbin/nologin
        home: /nonexistent
        create_home: false
    - name: Create the root-owned core release directory
      ansible.builtin.file:
        path: "{{ xiaozhi_core_root }}/releases"
        state: directory
        owner: root
        group: root
        mode: '0755'
    - name: Check out reviewed immutable core source
      ansible.builtin.git:
        repo: "{{ xiaozhi_core_repo_url }}"
        dest: "{{ xiaozhi_core_release }}/repo"
        version: "{{ xiaozhi_core_revision }}"
        recursive: false
        force: false
        umask: '0022'
      environment: {GIT_TERMINAL_PROMPT: '0'}
    - name: Require the isolated entrypoint and minimal dependency contract
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - -c
          - |
            from pathlib import Path
            root = Path('main/xiaozhi-server')
            assert (root / 'core_server.py').is_file()
            assert (root / 'core/cluster/transport_core.py').is_file()
            deps = [line.strip() for line in (root / 'requirements-core.txt').read_text().splitlines() if line.strip() and not line.startswith('#')]
            assert deps == ['aiohttp==3.13.2', 'nats-py==2.16.0']
        chdir: "{{ xiaozhi_core_release }}/repo"
      changed_when: false
    - name: Create the release-specific minimal venv
      ansible.builtin.command:
        argv: [/usr/bin/python3, -m, venv, "{{ xiaozhi_core_release }}/venv"]
        creates: "{{ xiaozhi_core_release }}/venv/bin/python"
    - name: Install only transport core dependencies
      ansible.builtin.pip:
        requirements: "{{ xiaozhi_core_release }}/repo/main/xiaozhi-server/{{ 'requirements-core-voice.txt' if xiaozhi_core_tts_enabled else 'requirements-core.txt' }}"
        virtualenv: "{{ xiaozhi_core_release }}/venv"
        extra_args: --disable-pip-version-check
      register: xiaozhi_core_dependencies
    - name: Verify TTS worker agreement and provision the core audio bundle
      ansible.builtin.include_tasks: tts_config.yml
      when: xiaozhi_core_tts_enabled
    - name: Install the gateway-matching authentication environment
      ansible.builtin.template:
        src: core.env.j2
        dest: /etc/xiaozhi-core.env
        owner: root
        group: root
        mode: '0600'
      no_log: true
      diff: false
      register: xiaozhi_core_env
    - name: Inspect an installed Settings runtime revision overlay
      ansible.builtin.stat:
        path: /etc/xiaozhi-core-runtime/revision.env
      register: xiaozhi_core_runtime_overlay
    - name: Require an explicit voice revision when the runtime apply overlay exists
      ansible.builtin.assert:
        that: xiaozhi_core_asr_revision is not none
      when: xiaozhi_core_runtime_overlay.stat.exists
    - name: Converge the existing runtime overlay to the frozen Ansible voice revision
      ansible.builtin.copy:
        content: "XIAOZHI_CORE_ASR_REVISION={{ xiaozhi_core_asr_revision }}\n"
        dest: /etc/xiaozhi-core-runtime/revision.env
        owner: root
        group: root
        mode: '0600'
      when: xiaozhi_core_runtime_overlay.stat.exists
      register: xiaozhi_core_runtime_overlay_update
      diff: false
    - name: Install the core systemd candidate
      ansible.builtin.template:
        src: core.service.j2
        dest: /etc/systemd/system/xiaozhi-core.service
        owner: root
        group: root
        mode: '0644'
      register: xiaozhi_core_unit
    - name: Start or restart core only when deployment changes
      ansible.builtin.systemd_service:
        name: xiaozhi-core
        enabled: true
        daemon_reload: "{{ xiaozhi_core_unit.changed }}"
        state: "{{ 'restarted' if xiaozhi_core_env.changed or xiaozhi_core_unit.changed or xiaozhi_core_dependencies.changed or (xiaozhi_core_runtime_overlay_update.changed | default(false)) or (xiaozhi_core_tts_bundle_install.changed | default(false)) else 'started' }}"
    - name: Require identity, transport readiness and resolved VIP observation
      ansible.builtin.uri:
        url: "http://{{ cluster_ip }}:{{ xiaozhi_core_port }}/status"
        use_proxy: false
        follow_redirects: none
        timeout: 2
      register: xiaozhi_core_status
      changed_when: false
      until:
        - xiaozhi_core_status.json.protocol | default('') == 'xiaozhi-core-transport-v1'
        - xiaozhi_core_status.json.core_id | default('') == inventory_hostname
        - xiaozhi_core_status.json.status | default('') == 'ready'
        - xiaozhi_core_status.json.local_vip_owner | default(none) is boolean
        - xiaozhi_core_status.json.conversation_runtime | default(true) is sameas false
        - not xiaozhi_core_tts_enabled or ('voice_tts' in (xiaozhi_core_status.json.capabilities | default([])) and xiaozhi_core_status.json.tts.revision | default(0) == xiaozhi_core_asr_revision)
        - not xiaozhi_core_worker_rpc or xiaozhi_core_status.json.worker_rpc.state | default('') == 'connected'
      retries: 10
      delay: 1
