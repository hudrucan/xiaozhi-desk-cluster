---
- name: Require no interrupted or active Settings runtime apply before deployment
  ansible.builtin.include_tasks: "{{ role_path }}/../xiaozhi_runtime_apply/tasks/require_idle.yml"

- name: Require all three core members and pinned Debian ARM64 source
  ansible.builtin.assert:
    that:
      - groups.get('xiaozhi_mqtt_gateways', []) | sort == ['deskb1x', 'deskb2x', 'deskb3x']
      - ansible_play_hosts_all | sort == groups['xiaozhi_mqtt_gateways'] | sort
      - inventory_hostname is match('^[A-Za-z0-9_-]{1,128}$')
      - ansible_facts.os_family == 'Debian'
      - ansible_facts.architecture in ['aarch64', 'arm64']
      - ansible_facts.python.version.major == 3
      - ansible_facts.python.version.minor >= 11
      - xiaozhi_core_worker_rpc is boolean
      - xiaozhi_core_tts_enabled is boolean
      - not xiaozhi_core_tts_enabled or (xiaozhi_core_asr_revision is not none and xiaozhi_core_worker_rpc and ansible_facts.python.version.minor == 11)
      - xiaozhi_core_asr_revision is none or (xiaozhi_core_asr_revision is integer and xiaozhi_core_asr_revision > 0 and xiaozhi_core_worker_rpc)
      - xiaozhi_core_revision is string and xiaozhi_core_revision is match('^[0-9a-f]{40}$')
      - xiaozhi_core_port is integer and xiaozhi_core_port >= 1024 and xiaozhi_core_port <= 65535
      - cluster_ip is match('^10\.10\.10\.(?:[1-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-4])$')
    fail_msg: Require three Debian ARM64 nodes, Python >=3.11 and a reviewed full core_server.py source SHA.

- name: Inspect an installed Settings runtime revision overlay before core mutation
  ansible.builtin.stat:
    path: /etc/xiaozhi-core-runtime/revision.env
  register: xiaozhi_core_preflight_overlay

- name: Preserve enabled voice runtime when a Settings overlay is installed
  ansible.builtin.assert:
    that: not xiaozhi_core_preflight_overlay.stat.exists or (xiaozhi_core_tts_enabled and xiaozhi_core_worker_rpc and xiaozhi_core_asr_revision is not none)
    fail_msg: An installed Settings runtime apply facility requires an explicit current frozen voice revision and voice core deployment.

- name: Require the same gateway backend authentication key from Vault
  ansible.builtin.assert:
    that:
      - vault_mqtt_server_secret is defined
      - vault_mqtt_server_secret is string
      - vault_mqtt_server_secret | trim | length > 0
      - vault_mqtt_server_secret | length <= 4096
      - vault_mqtt_server_secret is not search('[\x00\r\n]')
    quiet: true
  no_log: true

- name: Read local address metadata without network changes
  ansible.builtin.command:
    argv: [/usr/sbin/ip, -j, -4, address, show]
  register: xiaozhi_core_addresses
  changed_when: false
  check_mode: false

- name: Reset the matched interface list
  ansible.builtin.set_fact:
    xiaozhi_core_management_interfaces: []

- name: Match management and private addresses
  ansible.builtin.set_fact:
    xiaozhi_core_management_interfaces: "{{ xiaozhi_core_management_interfaces + [item.ifname] }}"
  loop: "{{ xiaozhi_core_addresses.stdout | from_json }}"
  when: ansible_host in (item.addr_info | default([]) | map(attribute='local') | list)
  loop_control:
    label: "{{ item.ifname }}"

- name: Require a single local management interface and private IP
  ansible.builtin.assert:
    that:
      - xiaozhi_core_management_interfaces | length == 1
      - xiaozhi_core_management_interfaces[0] is match('^[A-Za-z0-9_.-]{1,15}$')
      - cluster_ip in (xiaozhi_core_addresses.stdout | from_json | map(attribute='addr_info') | flatten | map(attribute='local') | list)
      - groups['xiaozhi_mqtt_gateways'] | map('extract', hostvars, 'cluster_ip') | unique | list | length == 3

- name: Freeze public core deployment inputs
  ansible.builtin.set_fact:
    xiaozhi_core_rollout:
      revision: "{{ xiaozhi_core_revision }}"
      port: "{{ xiaozhi_core_port }}"
      voice_revision: "{{ xiaozhi_core_asr_revision }}"
      tts_enabled: "{{ xiaozhi_core_tts_enabled }}"

- name: Retain a private comparison fingerprint for the shared auth key
  ansible.builtin.set_fact:
    xiaozhi_core_auth_fingerprint: "{{ vault_mqtt_server_secret | hash('sha256') }}"
  no_log: true

- name: Resolve shared NATS public defaults for optional worker RPC
  ansible.builtin.include_vars:
    file: "{{ role_path }}/../nats/defaults/main.yml"
    name: xiaozhi_core_nats_defaults
  when: xiaozhi_core_worker_rpc

- name: Require existing NATS application credentials for worker RPC
  ansible.builtin.assert:
    that:
      - nats_client_user | default(xiaozhi_core_nats_defaults.nats_client_user) is string
      - nats_client_user | default(xiaozhi_core_nats_defaults.nats_client_user) | trim | length > 0
      - nats_client_user | default(xiaozhi_core_nats_defaults.nats_client_user) is not search('[\x00\r\n]')
      - nats_client_password is defined and nats_client_password is string
      - nats_client_password | trim | length > 0
      - nats_client_password | length <= 4096
      - nats_client_password is not search('[\x00\r\n]')
      - nats_client_port | default(xiaozhi_core_nats_defaults.nats_client_port) is integer
      - nats_client_port | default(xiaozhi_core_nats_defaults.nats_client_port) >= 1
      - nats_client_port | default(xiaozhi_core_nats_defaults.nats_client_port) <= 65535
    quiet: true
  no_log: true
  when: xiaozhi_core_worker_rpc

- name: Derive all three private NATS servers and application username
  ansible.builtin.set_fact:
    xiaozhi_core_nats_port: "{{ nats_client_port | default(xiaozhi_core_nats_defaults.nats_client_port) }}"
    xiaozhi_core_nats_user: "{{ nats_client_user | default(xiaozhi_core_nats_defaults.nats_client_user) }}"
  when: xiaozhi_core_worker_rpc

- name: Retain optional RPC rollout agreement without exposing credentials
  ansible.builtin.set_fact:
    xiaozhi_core_rpc_fingerprint: "{{ {'enabled': xiaozhi_core_worker_rpc, 'user': xiaozhi_core_nats_user | default(''), 'port': xiaozhi_core_nats_port | default(0), 'password': nats_client_password if xiaozhi_core_worker_rpc else ''} | to_json | hash('sha256') }}"
  no_log: true

- name: Check validated Cloud state before any opt-in voice core mutation
  ansible.builtin.include_tasks: voice_preflight.yml
  when: xiaozhi_core_asr_revision is not none

- name: Require local worker TTS bundle before any audio core mutation
  ansible.builtin.include_tasks: tts_preflight.yml
  when: xiaozhi_core_tts_enabled

- name: Include the frozen TTS identity in all-core rollout agreement
  ansible.builtin.set_fact:
    xiaozhi_core_rollout: "{{ xiaozhi_core_rollout | combine({'tts_fingerprint': xiaozhi_core_tts_fingerprint}) }}"
  when: xiaozhi_core_tts_enabled
  no_log: true
