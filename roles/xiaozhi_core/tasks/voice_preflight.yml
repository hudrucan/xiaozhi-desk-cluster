---
- name: Read control-plane public port defaults without deployment
  ansible.builtin.include_vars:
    file: "{{ role_path }}/../xiaozhi_control_plane/defaults/main.yml"
    name: xiaozhi_core_voice_cp_defaults
- name: Read all live desired snapshots without Cloud mutation
  ansible.builtin.uri:
    url: "http://{{ hostvars[item].cluster_ip }}:{{ xiaozhi_control_plane_port | default(xiaozhi_core_voice_cp_defaults.xiaozhi_control_plane_port) }}/api/cluster"
    use_proxy: false
    follow_redirects: none
    return_content: true
    timeout: 3
  loop: "{{ groups['xiaozhi_mqtt_gateways'] | sort }}"
  register: xiaozhi_core_voice_desired
  changed_when: false
  check_mode: false
  no_log: true
- name: Require shared desired revision to match the immutable voice deployment
  ansible.builtin.assert:
    that:
      - item.json.node_id == item.item
      - item.json.protocol == 'xiaozhi-control-plane-v1'
      - item.json.configuration.config_provider == 'google_drive'
      - item.json.configuration.settings_scope == 'cluster'
      - item.json.configuration.schema_version == 2
      - item.json.configuration.desired_revision == xiaozhi_core_asr_revision
      - item.json.configuration.sync_status == 'synced'
      - item.json.reconciliation.last_success_at is not none
  loop: "{{ xiaozhi_core_voice_desired.results }}"
  no_log: true
