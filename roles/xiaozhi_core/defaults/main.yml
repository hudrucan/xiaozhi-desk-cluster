---
# Reviewed transport-only release; conversation providers are disabled.
xiaozhi_core_revision: 1cff3e9dac8830541ab99d84b5f60383dc833b7a
xiaozhi_core_repo_url: https://github.com/hudrucan/xiaozhi-desk-robot-server.git
xiaozhi_core_root: /opt/xiaozhi-core
xiaozhi_core_release: "{{ xiaozhi_core_root }}/releases/{{ xiaozhi_core_revision }}"
xiaozhi_core_port: 8000
xiaozhi_core_service_user: xiaozhi-core

# Optional bounded diagnostic RPC; it does not enable conversation providers.
xiaozhi_core_worker_rpc: false

# Opt-in voice-to-text coordinator; immutable exported worker revision.
xiaozhi_core_asr_revision: null

# Separate opt-in after all three segment workers and direct synthesis pass.
xiaozhi_core_tts_enabled: false
xiaozhi_core_tts_config: /etc/xiaozhi-core-tts/config.json
xiaozhi_core_tts_worker_config: /etc/xiaozhi-worker-tts/config.json
