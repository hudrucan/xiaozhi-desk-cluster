---
- name: Require the selected single-node trial and existing forwarding
  ansible.builtin.assert:
    that:
      - inventory_hostname == 'deskb3x'
      - ansible_host == '192.168.1.103'
      - ansible_play_hosts_all | length == 1
- name: Refuse a trial rerun after HA promotion
  ansible.builtin.command:
    argv: [/usr/bin/python3, '-c', "import subprocess; assert subprocess.run(['systemctl','is-active','--quiet','desk-vpn']).returncode != 0, 'HA is already active; use vpn-ha.yml'"]
  changed_when: false
- name: Verify module and tools without changing network
  ansible.builtin.command:
    argv: [/usr/bin/python3, '-c', "import pathlib,subprocess; subprocess.run(['/usr/sbin/modprobe','-n','wireguard'],check=True); assert all(pathlib.Path(p).exists() for p in ['/usr/bin/wg','/usr/bin/wg-quick','/usr/sbin/iptables']); assert pathlib.Path('/proc/sys/net/ipv4/ip_forward').read_text().strip()=='1'"]
  changed_when: false
- name: Require no Xiaozhi or DNS VIP on the trial node
  ansible.builtin.command:
    argv: [/usr/bin/python3, '-c', "import json,subprocess; rows=json.loads(subprocess.check_output(['ip','-j','-4','addr'])); addresses={a['local'] for r in rows for a in r.get('addr_info',[])}; assert not addresses.intersection({'192.168.1.186','192.168.1.250'}); routes=json.loads(subprocess.check_output(['ip','-j','-4','route','show','table','all'])); assert not any(r.get('dst','').startswith('10.77.') for r in routes if r.get('dev')!='wgdesk0')"]
  changed_when: false
- name: Freeze existing voice DNS and VIP state
  ansible.builtin.command:
    argv: [/usr/bin/python3, '-c', "{{ lookup('ansible.builtin.file', 'roles/desk_ui/files/ui_guard.py') }}", freeze]
  register: protected_before
  changed_when: false
  no_log: true
- name: Load local ignored trial credentials
  ansible.builtin.set_fact:
    vpn_trial_credentials: "{{ lookup('ansible.builtin.file', 'secret/vpn-trial/credentials.json') | from_json }}"
  no_log: true
- name: Create isolated trial paths
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    mode: "{{ item.mode }}"
  loop:
    - {path: /etc/desk-vpn-trial, mode: '0700'}
    - {path: /usr/local/libexec/desk-vpn-trial, mode: '0755'}
- name: Install scoped firewall helper
  ansible.builtin.copy:
    src: firewall.py
    dest: /usr/local/libexec/desk-vpn-trial/firewall.py
    mode: '0755'
    validate: /usr/bin/python3 -c "import ast,sys; ast.parse(open(sys.argv[1]).read())" %s
  register: firewall_source
- name: Install trial WireGuard configuration
  ansible.builtin.template:
    src: wgdesk0.conf.j2
    dest: /etc/desk-vpn-trial/wgdesk0.conf
    mode: '0600'
  no_log: true
  register: vpn_source
- name: Install trial unit
  ansible.builtin.template:
    src: desk-vpn-trial.service.j2
    dest: /etc/systemd/system/desk-vpn-trial.service
    mode: '0644'
  register: vpn_unit
- block:
    - name: Start only the trial VPN
      ansible.builtin.systemd_service:
        name: desk-vpn-trial
        daemon_reload: "{{ vpn_unit.changed }}"
        enabled: false
        state: "{{ 'restarted' if vpn_source.changed or vpn_unit.changed or firewall_source.changed else 'started' }}"
    - name: Verify tunnel interface and restricted firewall
      ansible.builtin.command:
        argv: [/usr/bin/python3, '-c', "import subprocess; assert subprocess.check_output(['wg','show','wgdesk0','listen-port'],text=True).strip()=='51820'; subprocess.run(['/usr/sbin/iptables','-C','FORWARD','-i','wgdesk0','-j','DESK_WG_FORWARD'],check=True); subprocess.run(['/usr/sbin/iptables','-C','DESK_WG_FORWARD','-j','DROP'],check=True)"]
      changed_when: false
    - name: Verify voice DNS VIP and policy were preserved
      ansible.builtin.command:
        argv: [/usr/bin/python3, '-c', "{{ lookup('ansible.builtin.file', 'roles/desk_ui/files/ui_guard.py') }}", guard]
        stdin: "{{ protected_before.stdout }}"
      changed_when: false
  rescue:
    - ansible.builtin.systemd_service:
        name: desk-vpn-trial
        state: stopped
    - ansible.builtin.fail:
        msg: Trial failed; VPN stopped and dedicated rules removed. Existing voice/DNS services were not restarted.
