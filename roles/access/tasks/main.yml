---
- name: Ensure ops user exists
  ansible.builtin.user:
    name: ops
    shell: /bin/bash
    create_home: true
    groups: sudo
    append: true

- name: Ensure ops SSH directory exists
  ansible.builtin.file:
    path: /home/ops/.ssh
    state: directory
    owner: ops
    group: ops
    mode: "0700"

- name: Install Mac public key for ops
  ansible.builtin.lineinfile:
    path: /home/ops/.ssh/authorized_keys
    line: "{{ lookup('ansible.builtin.file', lookup('env', 'HOME') + '/.ssh/id_ed25519.pub') }}"
    create: true
    owner: ops
    group: ops
    mode: "0600"

- name: Allow ops passwordless sudo
  ansible.builtin.copy:
    dest: /etc/sudoers.d/90-ops-ansible
    content: "ops ALL=(ALL) NOPASSWD: ALL\n"
    owner: root
    group: root
    mode: "0440"
    validate: "/usr/sbin/visudo -cf %s"
