---
- name: Install only the explicitly enabled external LCD client
  when: desk_pi_panel_enabled | bool
  block:
    - name: Verify the existing MPI3501 driver and devices before deployment
      ansible.builtin.script:
        cmd: >-
          preflight.py
          --framebuffer {{ desk_pi_panel_framebuffer | quote }}
          --touch {{ desk_pi_panel_touch | quote }}
          --overlay {{ desk_pi_panel_overlay | quote }}
          --overlay-sha256 {{ desk_pi_panel_overlay_sha256 | quote }}
        executable: /usr/bin/python3
      check_mode: false
      changed_when: false
      tags: [always, panel-preflight]
    - name: Install official framebuffer renderer and input dependencies
      ansible.builtin.apt:
        name: [python3-pil, python3-evdev, gcc, fonts-dejavu-core, polkitd, raspi-utils-core]
        state: present
        install_recommends: false
    - name: Create isolated display client paths
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop: [/etc/desk-cluster-panel, /usr/local/libexec/desk-cluster-panel]
    - name: Install native RGB565 packing source
      ansible.builtin.copy:
        src: rgb565.c
        dest: /usr/local/libexec/desk-cluster-panel/rgb565.c
        mode: '0644'
      register: packer_source
    - ansible.builtin.stat:
        path: /usr/local/libexec/desk-cluster-panel/rgb565.so
      register: packer_binary
    - name: Build the small packing helper for this Pi architecture
      ansible.builtin.command:
        argv: [gcc, -O2, -shared, -fPIC, -o, /usr/local/libexec/desk-cluster-panel/rgb565.so, /usr/local/libexec/desk-cluster-panel/rgb565.c]
      when: packer_source.changed or not packer_binary.stat.exists
      register: packer_build
    - name: Install the read-only display client
      ansible.builtin.copy:
        src: panel.py
        dest: /usr/local/libexec/desk-cluster-panel/panel.py
        mode: '0755'
        backup: true
        validate: /usr/bin/python3 -c "import ast,sys; ast.parse(open(sys.argv[1]).read())" %s
      register: panel_source
      tags: [panel-ui]
    - name: Install the local picture timeout controller
      ansible.builtin.copy:
        src: display_idle.py
        dest: /usr/local/libexec/desk-cluster-panel/display_idle.py
        mode: '0644'
      register: panel_display_idle
      tags: [panel-ui]
    - name: Install the local calibration UI
      ansible.builtin.copy:
        src: calibration_ui.py
        dest: /usr/local/libexec/desk-cluster-panel/calibration_ui.py
        mode: '0644'
      register: panel_calibration_ui
    - name: Install the local fetch interval preferences
      ansible.builtin.copy:
        src: fetch_settings.py
        dest: /usr/local/libexec/desk-cluster-panel/fetch_settings.py
        mode: '0644'
      register: panel_fetch_settings
      tags: [panel-ui]
    - name: Install the fixed console mode helper
      ansible.builtin.copy:
        src: console.py
        dest: /usr/local/libexec/desk-cluster-panel/console.py
        mode: '0755'
      register: panel_console
    - name: Install local Pi telemetry and reboot controller
      ansible.builtin.copy:
        src: pi_system.py
        dest: /usr/local/libexec/desk-cluster-panel/pi_system.py
        mode: '0644'
      register: panel_pi_system
      tags: [panel-ui]
    - name: Persist firmware telemetry access for the video group
      ansible.builtin.copy:
        src: 99-desk-panel-vcio.rules
        dest: /etc/udev/rules.d/99-desk-panel-vcio.rules
        mode: '0644'
      register: panel_vcio_rule
      tags: [panel-ui]
    - name: Reload firmware device permissions without triggering devices
      ansible.builtin.command: udevadm control --reload-rules
      when: panel_vcio_rule.changed
      changed_when: false
      tags: [panel-ui]
    - name: Allow the current firmware device through the video group
      ansible.builtin.file:
        path: /dev/vcio
        owner: root
        group: video
        mode: '0660'
      tags: [panel-ui]
    - name: Allow only local reboot actions for the panel user
      ansible.builtin.template:
        src: desk-panel-reboot.rules.j2
        dest: /etc/polkit-1/rules.d/49-desk-panel-reboot.rules
        owner: root
        group: root
        mode: '0644'
      tags: [panel-ui]
    - name: Install the optional four-point touch calibration helper
      ansible.builtin.copy:
        src: calibrate.py
        dest: /usr/local/libexec/desk-cluster-panel/calibrate.py
        mode: '0755'
    - name: Configure the existing LCD and input device without changing drivers
      ansible.builtin.template:
        src: config.json.j2
        dest: /etc/desk-cluster-panel/config.json
        mode: '0644'
      register: panel_config
    - name: Install the display service
      ansible.builtin.template:
        src: desk-cluster-panel.service.j2
        dest: /etc/systemd/system/desk-cluster-panel.service
        mode: '0644'
      register: panel_unit
      tags: [panel-ui]
    - name: Start the external panel
      ansible.builtin.systemd_service:
        name: desk-cluster-panel
        enabled: true
        daemon_reload: "{{ panel_unit.changed | default(false) }}"
        state: >-
          {{ 'restarted' if
             (panel_source.changed | default(false)) or
             (panel_display_idle.changed | default(false)) or
             (panel_fetch_settings.changed | default(false)) or
             (panel_pi_system.changed | default(false)) or
             (panel_calibration_ui.changed | default(false)) or
             (panel_console.changed | default(false)) or
             (panel_config.changed | default(false)) or
             (panel_unit.changed | default(false)) or
             (packer_build.changed | default(false))
             else 'started' }}
      tags: [panel-ui]
