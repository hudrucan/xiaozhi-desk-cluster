---
# There is intentionally no Ansible VIP variable. Cloud desired state owns it.
xiaozhi_ingress_port: 80
xiaozhi_ingress_vrid: 51
xiaozhi_ingress_stats_socket: /run/xiaozhi-haproxy.sock
xiaozhi_ingress_probe: /usr/local/libexec/xiaozhi-ingress-probe
xiaozhi_ingress_state_file: /etc/xiaozhi-ingress.json
xiaozhi_ingress_verify_retries: 20
xiaozhi_ingress_verify_delay: 2
# Settings HTML transfer has a separate timeout from the cheap health probe.
xiaozhi_ingress_settings_timeout: 10
# Refresh neighbor/AP learning only while the instance owns the floating VIP.
xiaozhi_ingress_garp_refresh_seconds: 30
xiaozhi_ingress_garp_refresh_repeat: 2

# Owner-only unicast ARP supplements broadcast GARP on Wi-Fi offload adapters.
xiaozhi_ingress_peer_arp_seconds: 5
