---
- name: Require the existing three-node private cluster
  ansible.builtin.assert:
    that:
      - desk_network_enabled | default(false) | bool
      - groups['deskboxes'] | sort == ['deskb1x','deskb2x','deskb3x']
      - ansible_play_hosts_all | length == 3
- name: Freeze protected services before Network installation
  ansible.builtin.command:
    argv: [python3, '-c', "{{ lookup('file',desk_repo_root+'/roles/desk_ui/files/ui_guard.py') }}", freeze]
  register: network_before
  changed_when: false
  no_log: true
- name: Install packaged daemonless runtime
  ansible.builtin.apt:
    name: podman
    state: present
- name: Disable daemon and automatic image updates
  ansible.builtin.systemd_service:
    name: '{{ item }}'
    state: stopped
    enabled: false
  loop: [podman.socket, podman-auto-update.timer, podman-restart.service]
- name: Cache pinned official ARM64 image
  ansible.builtin.command:
    argv: [podman, pull, 'ghcr.io/netalertx/netalertx@sha256:f95bca7a794141296dd1d16be5bb7f39f6fdbcd20353cdb51eee696e12d317f6']
  changed_when: false
- name: Verify cached image architecture
  ansible.builtin.command:
    argv: [podman, inspect, '--format', '{{ "{{.Architecture}}" }}', 'ghcr.io/netalertx/netalertx@sha256:f95bca7a794141296dd1d16be5bb7f39f6fdbcd20353cdb51eee696e12d317f6']
  register: network_arch
  changed_when: false
  failed_when: network_arch.stdout != 'arm64'
- name: Create isolated persistent and runtime metadata paths
  ansible.builtin.file:
    path: '{{ item.path }}'
    state: directory
    mode: '{{ item.mode }}'
  loop:
    - {path: /etc/desk-network, mode: '0700'}
    - {path: /usr/local/libexec/desk-network, mode: '0755'}
    - {path: /var/lib/desk-network, mode: '0700'}
    - {path: /var/lib/desk-network/state, mode: '0700'}
    - {path: /var/lib/desk-network/data/config, mode: '0700'}
    - {path: /var/lib/desk-network/data/db, mode: '0700'}
- name: Load existing ignored Network credentials
  ansible.builtin.set_fact:
    network_credentials: "{{ lookup('file',desk_repo_root+'/secret/network/credentials.json') | from_json }}"
  no_log: true
- name: Install checkpoint worker before its parent
  ansible.builtin.include_tasks: checkpoint_worker.yml
- name: Install bounded lease, snapshot and prefix helpers
  ansible.builtin.copy:
    src: '{{ item }}'
    dest: '/usr/local/libexec/desk-network/{{ item }}'
    mode: '0755'
    validate: /usr/bin/python3 -c "import ast,sys; ast.parse(open(sys.argv[1]).read())" %s
  loop: [checkpoint_source.py, peer_http.py, ha.py, seed.py, api-loopback.py, verify_ready.py, mdns.py, arp.py, discovery.py, bootstrap.py, checkpoint_budget.py, api_read_cache.py]
  register: network_helpers
- name: Install checkpoint-only resource budget without throttling lease renewal
  ansible.builtin.template:
    src: desk-network-checkpoint.slice.j2
    dest: /etc/systemd/system/desk-network-checkpoint.slice
    mode: '0644'
  register: network_checkpoint_budget
- name: Load the checkpoint resource budget
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: network_checkpoint_budget.changed
- name: Install native scan progress UI
  ansible.builtin.copy:
    src: scan-ui.js
    dest: /usr/local/libexec/desk-network/scan-ui.js
    mode: '0644'
- name: Install explicit managed-setting labels and read-only UI controls
  ansible.builtin.copy:
    src: settings-policy.js
    dest: /usr/local/libexec/desk-network/settings-policy.js
    mode: '0644'
- name: Retain immutable policy through the official startup hook
  ansible.builtin.copy:
    src: override-policy.sh
    dest: /usr/local/libexec/desk-network/override-policy.sh
    mode: '0755'
  register: network_startup_hook
- name: Install request-scoped language cache for the pinned native UI
  ansible.builtin.copy:
    src: lang-cached.php
    dest: /usr/local/libexec/desk-network/lang-cached.php
    mode: '0644'
  register: network_language
- name: Download exact official Alpine PHP 8.3.29 ARM64 OPcache package
  ansible.builtin.get_url:
    url: https://dl-cdn.alpinelinux.org/alpine/v3.22/community/aarch64/php83-opcache-8.3.29-r0.apk
    dest: /usr/local/libexec/desk-network/php83-opcache-8.3.29-r0.apk
    checksum: sha256:e6f46dec63fdab796e48cd0b3f10b868306dc415c0fc47706771e4ed69d47e38
    mode: '0644'
- name: Install bounded pinned-module extractor
  ansible.builtin.copy:
    src: prepare-opcache.py
    dest: /usr/local/libexec/desk-network/prepare-opcache.py
    mode: '0755'
- name: Extract only the verified PHP module into the host mount path
  ansible.builtin.command:
    argv: [python3, /usr/local/libexec/desk-network/prepare-opcache.py, /usr/local/libexec/desk-network/php83-opcache-8.3.29-r0.apk, /usr/local/libexec/desk-network/opcache.so]
  register: network_opcache_module
  changed_when: (network_opcache_module.stdout | from_json).changed
- name: Install bounded in-memory PHP opcode cache configuration
  ansible.builtin.copy:
    src: opcache.ini
    dest: /usr/local/libexec/desk-network/opcache.ini
    mode: '0644'
  register: network_opcache_config
- name: Verify PHP ABI and opcode cache in an isolated no-network container
  ansible.builtin.command:
    argv:
      - podman
      - run
      - --rm
      - --network=none
      - --read-only
      - --cap-drop=ALL
      - --memory=128m
      - --cpus=0.3
      - --entrypoint=php
      - -v
      - /usr/local/libexec/desk-network/opcache.so:/usr/lib/php83/modules/opcache.so:ro
      - -v
      - /usr/local/libexec/desk-network/opcache.ini:/etc/php83/conf.d/10_desk_opcache.ini:ro
      - ghcr.io/netalertx/netalertx@sha256:f95bca7a794141296dd1d16be5bb7f39f6fdbcd20353cdb51eee696e12d317f6
      - -d
      - opcache.enable_cli=1
      - -r
      - 'if(PHP_VERSION!=="8.3.29" || !extension_loaded("Zend OPcache") || !opcache_get_status(false)["opcache_enabled"]) exit(1); echo "PHP OPcache ABI verified";'
  changed_when: false
  when: network_opcache_module.changed or network_opcache_config.changed
- name: Install pinned cluster-managed scan policy
  ansible.builtin.copy:
    src: policy.json
    dest: /etc/desk-network/policy.json
    mode: '0644'
  register: network_policy
- name: Install private peer certificate and key
  ansible.builtin.copy:
    src: '{{ desk_repo_root }}/secret/network/{{ item }}'
    dest: '/etc/desk-network/{{ item }}'
    mode: '0600'
  loop: [peer.crt, peer.key]
  no_log: true
  register: network_tls
- name: Install opt-in warm standby lifecycle helpers
  ansible.builtin.copy:
    src: '{{ item }}'
    dest: '/usr/local/libexec/desk-network/{{ item }}'
    mode: '0755'
  loop: [warm_runtime.py, warm-backend.sh, warm-idle.sh]
  register: network_warm_helpers

- name: Install bounded cluster configuration
  ansible.builtin.template:
    src: config.json.j2
    dest: /etc/desk-network/config.json
    mode: '0600'
  register: network_config
  no_log: true
- name: Check for a retained initial checkpoint on controller
  ansible.builtin.stat:
    path: '{{ desk_repo_root }}/secret/network/seed/head.json'
  delegate_to: localhost
  become: false
  run_once: true
  register: network_seed
- name: Create initial WAL-consistent checkpoint from the stopped discovery canary
  ansible.builtin.command:
    argv: [python3, /usr/local/libexec/desk-network/seed.py]
  delegate_to: deskb1x
  run_once: true
  when: not network_seed.stat.exists
- name: Retain the initial manifest in ignored controller storage
  ansible.builtin.fetch:
    src: /var/lib/desk-network-seed/head.json
    dest: '{{ desk_repo_root }}/secret/network/seed/head.json'
    flat: true
  delegate_to: deskb1x
  run_once: true
  when: not network_seed.stat.exists
  no_log: true
- name: Read retained initial checkpoint identity
  ansible.builtin.set_fact:
    network_seed_head: "{{ lookup('file',desk_repo_root+'/secret/network/seed/head.json') | from_json }}"
  no_log: true
- name: Retain initial compressed checkpoint in ignored controller storage
  ansible.builtin.fetch:
    src: '/var/lib/desk-network-seed/{{ network_seed_head.digest }}.gz'
    dest: '{{ desk_repo_root }}/secret/network/seed/{{ network_seed_head.digest }}.gz'
    flat: true
  delegate_to: deskb1x
  run_once: true
  when: not network_seed.stat.exists
  no_log: true
- name: Keep controller checkpoint private
  ansible.builtin.file:
    path: '{{ desk_repo_root }}/secret/network/seed/{{ item }}'
    mode: '0600'
  loop: ['head.json','{{ network_seed_head.digest }}.gz']
  delegate_to: localhost
  become: false
  run_once: true
  no_log: true
- name: Seed a new replica without overwriting existing history
  ansible.builtin.copy:
    src: '{{ desk_repo_root }}/secret/network/seed/{{ item }}'
    dest: '/var/lib/desk-network/state/{{ item }}'
    mode: '0600'
    force: false
  loop: ['{{ network_seed_head.digest }}.gz', 'head.json']
  no_log: true
- name: Prepare owner-routed NATS scan runtime
  ansible.builtin.include_tasks: distributed.yml
  when: desk_network_scan_enabled | default(false) | bool
- name: Install persistent lease controller and container cleanup
  ansible.builtin.template:
    src: desk-network.service.j2
    dest: /etc/systemd/system/desk-network.service
    mode: '0644'
  register: network_unit
- name: Install self-contained Network recovery UI independent of the collector
  ansible.builtin.copy:
    src: recovering.http
    dest: /etc/desk-network/recovering.http
    mode: '0644'
- name: Render owner-only health backend
  ansible.builtin.template:
    src: backend.cfg.j2
    dest: /etc/desk-network/backend.cfg
    mode: '0644'
- name: Check existing Network controller state
  ansible.builtin.command:
    argv: [systemctl, is-active, desk-network]
  register: network_active_before
  failed_when: false
  changed_when: false
- name: Remember whether the controller requires a rolling refresh
  ansible.builtin.set_fact:
    network_restart: '{{ network_checkpoint_artifacts.changed or network_helpers.changed or network_warm_helpers.changed or network_config.changed or network_policy.changed or network_unit.changed or network_startup_hook.changed or network_language.changed or network_tls.changed or network_opcache_module.changed or network_opcache_config.changed }}'
- name: Require protected voice DNS and VIP state to remain unchanged
  ansible.builtin.command:
    argv: [python3, '-c', "{{ lookup('file',desk_repo_root+'/roles/desk_ui/files/ui_guard.py') }}", guard]
    stdin: '{{ network_before.stdout }}'
  changed_when: false
