; PHP 8.3.29 ARM64 only, paired with the digest-pinned NetAlertX image.
zend_extension=/usr/lib/php83/modules/opcache.so
opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=32
opcache.interned_strings_buffer=4
opcache.max_accelerated_files=2000
; Keep timestamps for mutable/generated PHP configuration and deliberate patches.
opcache.validate_timestamps=1
opcache.revalidate_freq=0
; Read-only code cache in shared RAM; no persistent cache writes or JIT.
opcache.file_cache=
opcache.jit=disable
opcache.jit_buffer_size=0
