---
# Definition order ensures unit reload precedes restart when both are notified.
- name: Reload worker systemd units
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: not ansible_check_mode

- name: Restart Xiaozhi worker
  ansible.builtin.systemd_service:
    name: xiaozhi-worker
    enabled: true
    state: restarted
  when: not ansible_check_mode
