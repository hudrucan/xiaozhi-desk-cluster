---
xiaozhi_worker_repo_url: https://github.com/hudrucan/xiaozhi-desk-robot-server.git
xiaozhi_worker_revision: e586c725600dd79a3e24ec7f763bb32d7f9e3c9f
xiaozhi_worker_root: /opt/xiaozhi-worker
xiaozhi_worker_repo_dir: "{{ xiaozhi_worker_root }}/repo"
xiaozhi_worker_venv_dir: "{{ xiaozhi_worker_root }}/venv"
xiaozhi_worker_service_user: xiaozhi-worker
# Warm ASR + TTS model initialization precedes NATS subscription registration.
# A measured first TTS startup took 69 seconds; allow about 150 seconds for ping.
xiaozhi_worker_verify_retries: "{{ 30 if xiaozhi_worker_tts_enabled else 10 }}"
xiaozhi_worker_verify_delay: 2

# Explicit text-only provider opt-in. Normal worker deployment stays ping-only.
xiaozhi_worker_llm_enabled: false
xiaozhi_worker_llm_config: /etc/xiaozhi-worker-llm/config.json
xiaozhi_worker_llm_control_plane_root: /opt/xiaozhi-control-plane
xiaozhi_worker_llm_revision: b0b1938ef36c1499ff27ba5e5b153048e0b7e24c

# Explicit combined ASR/LLM opt-in. A verified existing local model is required.
xiaozhi_worker_asr_enabled: false
xiaozhi_worker_asr_config: /etc/xiaozhi-worker-asr/config.json
xiaozhi_worker_asr_vad_model: /opt/xiaozhi-models/vad/silero_vad.onnx
xiaozhi_worker_asr_vad_sha256: ''

# Local Sherpa is the current Cloud choice; install its isolated adapter only.
xiaozhi_worker_asr_local: true

# Must be supplied after the ASR source is reviewed/committed.
xiaozhi_worker_asr_revision: null

# Parallel segments inside one voice turn; not enabled by existing playbooks.
xiaozhi_worker_tts_enabled: false
xiaozhi_worker_tts_revision: null
xiaozhi_worker_tts_config: /etc/xiaozhi-worker-tts/config.json
# Private cache-only bundle exported on the controller using the server exporter.
xiaozhi_worker_tts_asset_bundle: ''
xiaozhi_worker_tts_controller_server_dir: "{{ playbook_dir }}/../xiaozhi-esp32-server/main/xiaozhi-server"
