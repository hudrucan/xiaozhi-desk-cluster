[deskboxes]
deskb1x ansible_host=192.168.1.101
deskb2x ansible_host=192.168.1.102
deskb3x ansible_host=192.168.1.103

[xiaozhi_workers]
deskb1x
deskb2x
deskb3x

[xiaozhi_control_planes]
deskb1x
deskb2x
deskb3x

[xiaozhi_ingress]
deskb1x
deskb2x
deskb3x

# Opt-in gateways; all three nodes receive connections through MQTT TCP ingress.
[xiaozhi_mqtt_gateways]
deskb1x
deskb2x
deskb3x

# Opt-in DNS foundation; dns.yml only, never included by site.yml.
[desk_dns]
deskb1x
deskb2x
deskb3x

[deskboxes:vars]
ansible_user=ops
ansible_python_interpreter=/usr/bin/python3
