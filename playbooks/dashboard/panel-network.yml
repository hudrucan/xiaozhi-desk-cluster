---
- name: Extend only the cached panel projection with Network and monitoring metadata
  hosts: deskboxes
  become: true
  gather_facts: false
  serial: 1
  any_errors_fatal: true
  tasks:
    - name: Freeze protected voice, DNS and VIP state
      ansible.builtin.command:
        argv: [/usr/bin/python3, '-c', "{{ lookup('ansible.builtin.file', desk_repo_root + '/roles/desk_ui/files/ui_guard.py') }}", freeze]
      register: panel_network_before
      changed_when: false
      no_log: true
    - name: Record the existing Network controller without touching it
      ansible.builtin.command:
        argv: [systemctl, show, desk-network, '-p', MainPID, '-p', ActiveState, '-p', NRestarts]
      register: panel_network_controller_before
      changed_when: false
    - name: Build the cached dashboard collector
      ansible.builtin.import_tasks: ../../roles/desk_dashboard/tasks/build.yml
    - name: Deploy only the collector with rollback on failure
      block:
        - name: Back up and install the collector binary
          ansible.builtin.copy:
            src: '{{ dashboard_artifact }}'
            dest: /usr/local/libexec/desk-dashboard
            mode: '0755'
            backup: true
          register: panel_network_binary
        - name: Refresh only the dashboard collector
          ansible.builtin.systemd_service:
            name: desk-dashboard
            state: "{{ 'restarted' if panel_network_binary.changed else 'started' }}"
        - name: Require the extended cached projection
          ansible.builtin.uri:
            url: 'http://{{ cluster_ip }}:8010/api/cluster/panel'
            use_proxy: false
            timeout: 5
          register: panel_network_ready
          until: panel_network_ready.status == 200 and panel_network_ready.json.owners.network is defined and panel_network_ready.json.monitoring_preferred is defined
          retries: 12
          delay: 2
          changed_when: false
        - name: Verify protected services and configuration stayed unchanged
          ansible.builtin.command:
            argv: [/usr/bin/python3, '-c', "{{ lookup('ansible.builtin.file', desk_repo_root + '/roles/desk_ui/files/ui_guard.py') }}", guard]
            stdin: '{{ panel_network_before.stdout }}'
          changed_when: false
        - name: Read the Network controller after the collector refresh
          ansible.builtin.command:
            argv: [systemctl, show, desk-network, '-p', MainPID, '-p', ActiveState, '-p', NRestarts]
          register: panel_network_controller_after
          changed_when: false
        - name: Require the existing Network controller to remain untouched
          ansible.builtin.assert:
            that: panel_network_controller_before.stdout == panel_network_controller_after.stdout
      rescue:
        - name: Restore the collector backup when installation changed it
          ansible.builtin.copy:
            src: '{{ panel_network_binary.backup_file }}'
            dest: /usr/local/libexec/desk-dashboard
            remote_src: true
            mode: '0755'
          when: panel_network_binary.backup_file is defined
        - name: Resume the restored collector
          ansible.builtin.systemd_service:
            name: desk-dashboard
            state: restarted
        - ansible.builtin.fail:
            msg: Panel Network projection rollout failed; collector backup restored when available.
