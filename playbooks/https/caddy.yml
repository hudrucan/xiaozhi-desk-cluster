---
# No import from site.yml; all mutations require a separately reviewed opt-in.
- name: Read-only HTTPS preflight on the complete cluster
  hosts: xiaozhi_ingress
  become: true
  gather_facts: "{{ desk_https_phase | default('preflight') != 'rollback' }}"
  any_errors_fatal: "{{ desk_https_phase | default('preflight') != 'rollback' }}"
  tasks:
    - ansible.builtin.include_role:
        name: desk_https
        tasks_from: preflight
      when: desk_https_phase | default('preflight') != 'rollback'
    - ansible.builtin.include_role:
        name: desk_https
        tasks_from: rollback_preflight
      when: desk_https_phase | default('preflight') == 'rollback'

- name: Apply only the explicitly selected HTTPS phase
  hosts: "{{ 'desk_https_rollback_ready' if desk_https_phase | default('preflight') == 'rollback' else 'xiaozhi_ingress' }}"
  become: true
  gather_facts: false
  serial: 1
  order: sorted
  any_errors_fatal: true
  roles:
    - desk_https

  post_tasks:
  - name: Flush successful deployment handlers before backup retention
    ansible.builtin.meta: flush_handlers
    run_once: false
    when: &id001
    - ansible_play_hosts | length == ansible_play_hosts_all | length
    - ansible_run_tags | difference(['all']) | length == 0
    - ansible_skip_tags | length == 0
    - ansible_failed_task is not defined
    - ansible_play_hosts_all | map('extract', hostvars) | selectattr('ansible_failed_task', 'defined') | list | length == 0
    - desk_https_phase | default('preflight') == 'caddy'
  - name: Retain only recent and newest owned deployment backups
    ansible.builtin.include_role:
      name: desk_backup_retention
      apply:
        become: true
        run_once: false
    vars:
      desk_backup_retention_scopes:
      - /etc/desk-https/Caddyfile
      - /etc/desk-https/cloudflare.env
      - /etc/systemd/system/desk-caddy.service
      - caddy-binary
    run_once: false
    when: *id001
