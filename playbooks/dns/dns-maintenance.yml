---
- name: Install boot-local DNS health withdrawal without policy changes
  hosts: desk_dns
  become: true
  gather_facts: false
  serial: 1
  any_errors_fatal: true
  tasks:
    - name: Require a healthy idle maintenance controller before backend changes
      ansible.builtin.command:
        argv: [/usr/bin/python3, '-c', "from pathlib import Path; assert not Path('/run/desk-node-maintenance/state.json').exists(); print('No maintenance in progress')"]
      changed_when: false
    - ansible.builtin.slurp:
        src: /etc/desk-dns/backend-haproxy.cfg
      register: old
    - ansible.builtin.template:
        src: "{{ desk_repo_root }}/roles/desk_dns/templates/maintenance-health.lua.j2"
        dest: /usr/local/libexec/desk-dns/maintenance-health.lua
        mode: '0644'
      register: lua
    - block:
        - ansible.builtin.command:
            argv: [/usr/bin/python3, '-c', "{{ lookup('ansible.builtin.file',desk_repo_root + '/roles/desk_dns/files/maintenance_proxy.py') }}"]
          register: candidate
          changed_when: false
        - ansible.builtin.copy:
            content: "{{ (candidate.stdout | from_json).candidate }}"
            dest: /etc/desk-dns/backend-haproxy.cfg
            mode: '0644'
            validate: /usr/sbin/haproxy -c -f %s
          register: proxy
        - ansible.builtin.systemd_service:
            name: desk-dns-backend
            state: "{{ 'restarted' if proxy.changed or lua.changed else 'started' }}"
        - ansible.builtin.command:
            argv: [/usr/local/libexec/desk-healthcheck, dns, --host, "{{ ansible_host }}", --port, '5353']
          register: health
          until: health.rc == 0
          retries: 10
          delay: 1
          changed_when: false
        - ansible.builtin.copy:
            content: '{{ {"protocol":"desk-dns-maintenance-v1","node":inventory_hostname} | to_json }}'
            dest: /etc/desk-dns/maintenance.json
            mode: '0644'
      rescue:
        - ansible.builtin.copy:
            content: "{{ old.content | b64decode }}"
            dest: /etc/desk-dns/backend-haproxy.cfg
            mode: '0644'
        - ansible.builtin.systemd_service: {name: desk-dns-backend, state: restarted}
        - ansible.builtin.fail: {msg: DNS gate failed; prior backend restored}
