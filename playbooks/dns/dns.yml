---
- name: Freeze DNS prerequisites on all nodes without changing Xiaozhi
  hosts: desk_dns
  become: true
  gather_facts: true
  any_errors_fatal: true
  tasks:
    - name: Read topology, package versions and protected Xiaozhi state
      ansible.builtin.include_role:
        name: desk_dns
        tasks_from: preflight
        public: true
    - name: Load existing DNS peer credentials for cluster UI
      ansible.builtin.include_vars:
        file: "{{ desk_repo_root }}/secret/desk-dns-sync.json"
      no_log: true
      when: desk_dns_client_identity_enabled | default(false)
    - name: Freeze a common DNS election and package version
      ansible.builtin.include_role:
        name: desk_dns
        tasks_from: freeze

- name: Install isolated AdGuard backends one node at a time
  hosts: desk_dns
  become: true
  gather_facts: false
  serial: 1
  any_errors_fatal: true
  tasks:
    - ansible.builtin.include_role:
        name: desk_dns
        tasks_from: backend

- name: Prepare all private client identity backends before DNS frontend activation
  hosts: desk_dns
  become: true
  gather_facts: false
  serial: 1
  any_errors_fatal: true
  tasks:
    - ansible.builtin.include_role:
        name: desk_dns
        tasks_from: cluster-backend
      when: desk_dns_client_identity_enabled | default(false)

- name: Start DNS frontends only after all three backends pass
  hosts: desk_dns
  become: true
  gather_facts: false
  serial: 1
  any_errors_fatal: true
  tasks:
    - ansible.builtin.include_role:
        name: desk_dns
        tasks_from: frontend
      when: not (desk_dns_client_identity_enabled | default(false))
    - ansible.builtin.include_role:
        name: desk_dns
        tasks_from: cluster-frontend
      when: desk_dns_client_identity_enabled | default(false)

- name: Activate independent DNS VRRP only after frontend verification
  hosts: desk_dns
  become: true
  gather_facts: false
  serial: 1
  any_errors_fatal: true
  tasks:
    - ansible.builtin.include_role:
        name: desk_dns
        tasks_from: vip

- name: Verify DNS pool, VIP and unchanged Xiaozhi processes
  hosts: desk_dns
  become: true
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - ansible.builtin.include_role:
        name: desk_dns
        tasks_from: verify
      when: not ansible_check_mode
