---
- name: Freeze DNS prerequisites on all nodes without changing Xiaozhi
  hosts: desk_dns
  become: true
  gather_facts: true
  any_errors_fatal: true
  tasks:
    - name: Read topology, package versions and protected Xiaozhi state
      ansible.builtin.include_role:
        name: desk_dns
        tasks_from: preflight
        public: true
    - name: Load existing DNS peer credentials for cluster UI
      ansible.builtin.include_vars:
        file: "{{ desk_repo_root }}/secret/desk-dns-sync.json"
      no_log: true
      when: desk_dns_client_identity_enabled | default(false)
    - name: Freeze a common DNS election and package version
      ansible.builtin.include_role:
        name: desk_dns
        tasks_from: freeze

- name: Install isolated AdGuard backends one node at a time
  hosts: desk_dns
  become: true
  gather_facts: false
  serial: 1
  any_errors_fatal: true
  tasks:
    - ansible.builtin.include_role:
        name: desk_dns
        tasks_from: backend

- name: Prepare all private client identity backends before DNS frontend activation
  hosts: desk_dns
  become: true
  gather_facts: false
  serial: 1
  any_errors_fatal: true
  tasks:
    - ansible.builtin.include_role:
        name: desk_dns
        tasks_from: cluster-backend
      when: desk_dns_client_identity_enabled | default(false)

- name: Start DNS frontends only after all three backends pass
  hosts: desk_dns
  become: true
  gather_facts: false
  serial: 1
  any_errors_fatal: true
  tasks:
    - ansible.builtin.include_role:
        name: desk_dns
        tasks_from: frontend
      when: not (desk_dns_client_identity_enabled | default(false))
    - ansible.builtin.include_role:
        name: desk_dns
        tasks_from: cluster-frontend
      when: desk_dns_client_identity_enabled | default(false)

- name: Activate independent DNS VRRP only after frontend verification
  hosts: desk_dns
  become: true
  gather_facts: false
  serial: 1
  any_errors_fatal: true
  tasks:
    - ansible.builtin.include_role:
        name: desk_dns
        tasks_from: vip

- name: Verify DNS pool, VIP and unchanged Xiaozhi processes
  hosts: desk_dns
  become: true
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - ansible.builtin.include_role:
        name: desk_dns
        tasks_from: verify
      when: not ansible_check_mode

  post_tasks:
  - name: Flush successful deployment handlers before backup retention
    ansible.builtin.meta: flush_handlers
    run_once: false
    when: &id001
    - ansible_play_hosts | length == ansible_play_hosts_all | length
    - ansible_run_tags | difference(['all']) | length == 0
    - ansible_skip_tags | length == 0
    - ansible_failed_task is not defined
    - ansible_play_hosts_all | map('extract', hostvars) | selectattr('ansible_failed_task', 'defined') | list | length == 0
  - name: Retain only recent and newest owned deployment backups
    ansible.builtin.include_role:
      name: desk_backup_retention
      apply:
        become: true
        run_once: false
    vars:
      desk_backup_retention_scopes:
      - /etc/systemd/system/desk-adguard.service
    run_once: false
    when: *id001
