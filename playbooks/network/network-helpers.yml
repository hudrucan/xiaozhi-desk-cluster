---
# Fast-path rollout for Desk Network helpers and checkpoint workers.
# Use --skip-tags homeassistant for a Desk Network-only deployment.
# Use this instead of playbooks/network/network.yml when the only changes are in:
#   roles/desk_network/files/{ha.py,checkpoint_budget.py,...}
#   roles/desk_homeassistant/files/agent.py   (election score only)
#   (warm_runtime.py is read by the warm containers when the controller restarts them below)
#   roles/desk_network/templates/desk-network-checkpoint.slice.j2
#
# Completes in ~60–90 s vs ~5–8 min for the full network.yml.
# Safety: identical copy+validate, identical serial restart + quarantine wait,
# identical verify_ready gate as network.yml.  Skips image pull, PHP opcache,
# TLS, NATS workers, dashboard, and ingress — none of those change here.
- name: Deploy updated network helpers to all replicas
  hosts: deskboxes
  become: true
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Validate cluster topology
      ansible.builtin.assert:
        that:
          - desk_network_enabled | default(false) | bool
          - groups['deskboxes'] | sort == ['deskb1x','deskb2x','deskb3x']
          - ansible_play_hosts_all | length == 3

    - name: Freeze protected services before touching files
      ansible.builtin.command:
        argv: [python3, '-c', "{{ lookup('file',desk_repo_root+'/roles/desk_ui/files/ui_guard.py') }}", freeze]
      register: network_helpers_before
      changed_when: false
      no_log: true

    - name: Install checkpoint worker before its parent
      ansible.builtin.include_tasks: "{{ desk_repo_root }}/roles/desk_network/tasks/checkpoint_worker.yml"
    - name: Install bounded lease, snapshot and checkpoint helpers
      ansible.builtin.copy:
        src: "{{ desk_repo_root }}/roles/desk_network/files/{{ item }}"
        dest: '/usr/local/libexec/desk-network/{{ item }}'
        mode: '0755'
        validate: /usr/bin/python3 -c "import ast,sys; ast.parse(open(sys.argv[1]).read())" %s
      loop: [checkpoint_source.py, peer_http.py, checkpoint_budget.py, bootstrap.py, discovery.py, api_read_cache.py, warm_runtime.py, ha.py]
      register: network_helpers_files

    - name: Install Home Assistant election agent (score weights)
      tags: homeassistant
      ansible.builtin.copy:
        src: "{{ desk_repo_root }}/roles/desk_homeassistant/files/agent.py"
        dest: /usr/local/libexec/desk-homeassistant/agent.py
        mode: '0700'
        validate: /usr/bin/python3 -c "import ast,sys; ast.parse(open(sys.argv[1]).read())" %s
      register: network_helpers_agent

    - name: Install checkpoint resource budget slice
      ansible.builtin.template:
        src: "{{ desk_repo_root }}/roles/desk_network/templates/desk-network-checkpoint.slice.j2"
        dest: /etc/systemd/system/desk-network-checkpoint.slice
        mode: '0644'
      register: network_helpers_slice

    - name: Install controller cgroup cleanup contract
      ansible.builtin.template:
        src: "{{ desk_repo_root }}/roles/desk_network/templates/desk-network.service.j2"
        dest: /etc/systemd/system/desk-network.service
        mode: '0644'
      register: network_helpers_unit

    - name: Reload systemd if slice changed
      ansible.builtin.systemd_service:
        daemon_reload: true
      when: network_helpers_slice.changed or network_helpers_unit.changed

    - name: Remember whether a rolling restart is needed
      ansible.builtin.set_fact:
        network_helpers_restart: '{{ network_checkpoint_artifacts.changed or network_helpers_files.changed or network_helpers_slice.changed or network_helpers_unit.changed }}'

    - name: Verify protected services unchanged
      ansible.builtin.command:
        argv: [python3, '-c', "{{ lookup('file',desk_repo_root+'/roles/desk_ui/files/ui_guard.py') }}", guard]
        stdin: '{{ network_helpers_before.stdout }}'
      changed_when: false

- name: Rolling restart — one replica at a time
  hosts: deskboxes
  become: true
  gather_facts: false
  any_errors_fatal: true
  serial: 1
  tasks:
    - name: Read state before the serial controller refresh
      ansible.builtin.uri:
        url: 'http://{{ cluster_ip }}:20213/network/desk/status'
        use_proxy: false
        timeout: 3
      register: network_helpers_state
      when: network_helpers_restart | default(false)

    - name: Request the existing checkpoint and warm owner handoff
      ansible.builtin.file:
        path: /run/desk-network/warm-drain
        state: touch
        mode: '0600'
      when:
        - network_helpers_restart | default(false)
        - network_helpers_state.json.state == 'active'

    - name: Wait for owner to hand off before restarting it
      ansible.builtin.uri:
        url: 'http://{{ cluster_ip }}:20213/network/desk/status'
        use_proxy: false
        timeout: 3
      register: network_helpers_drained
      until: network_helpers_drained.json.state | default('') == 'standby' and network_helpers_drained.json.sync | default('') == 'synced'
      retries: 40
      delay: 2
      when:
        - network_helpers_restart | default(false)
        - network_helpers_state.json.state == 'active'

    - name: Require the replacement owner before restarting a drained replica
      ansible.builtin.command:
        argv: [python3, /usr/local/libexec/desk-network/verify_ready.py]
      register: network_helpers_handoff
      until: network_helpers_handoff.rc == 0
      retries: 40
      delay: 3
      changed_when: false
      when:
        - network_helpers_restart | default(false)
        - network_helpers_state.json.state == 'active'

    - name: Restart controller only if files changed
      ansible.builtin.systemd_service:
        name: desk-network
        state: restarted
      when: hostvars[inventory_hostname].network_helpers_restart | default(false)

    - name: Wait out voter restart quarantine before touching next replica
      ansible.builtin.uri:
        url: 'http://{{ cluster_ip }}:20213/network/desk/status'
        use_proxy: false
        timeout: 3
      register: network_helpers_voter
      until: network_helpers_voter.json.voter_ready | default(false) and network_helpers_voter.json.sync | default('') == 'synced' and network_helpers_voter.json.warm_state | default('') in ['inactive', 'active']
      retries: 65
      delay: 3
      changed_when: false
      when: hostvars[inventory_hostname].network_helpers_restart | default(false)

- name: Restart Home Assistant agent on standby nodes only
  tags: homeassistant
  hosts: deskboxes
  become: true
  gather_facts: false
  any_errors_fatal: true
  serial: 1
  tasks:
    # The ready owner is skipped: restarting it restarts HA Core. It picks up
    # the new score on its next planned handoff (see playbooks/homeassistant/homeassistant-online-sync.yml).
    - name: Read Home Assistant status
      ansible.builtin.uri:
        url: 'http://{{ cluster_ip }}:20223/status'
        use_proxy: false
      register: network_helpers_ha
      when: hostvars[inventory_hostname].network_helpers_agent.changed | default(false)

    - name: Restart standby agent
      ansible.builtin.systemd_service:
        name: desk-homeassistant
        state: restarted
      when:
        - hostvars[inventory_hostname].network_helpers_agent.changed | default(false)
        - not (network_helpers_ha.json.ready | default(false))

    - name: Wait for standby agent to rejoin synced
      ansible.builtin.uri:
        url: 'http://{{ cluster_ip }}:20223/status'
        use_proxy: false
      register: network_helpers_ha_ready
      until: network_helpers_ha_ready.json.voter_ready and network_helpers_ha_ready.json.sync == 'synced'
      retries: 25
      delay: 2
      changed_when: false
      when:
        - hostvars[inventory_hostname].network_helpers_agent.changed | default(false)
        - not (network_helpers_ha.json.ready | default(false))

- name: Verify cluster health after rollout
  hosts: deskboxes
  become: true
  gather_facts: false
  any_errors_fatal: true
  run_once: true
  tasks:
    - name: Wait for one native-ready majority owner
      ansible.builtin.command:
        argv: [python3, /usr/local/libexec/desk-network/verify_ready.py]
      register: network_helpers_ready
      retries: 50
      delay: 3
      until: network_helpers_ready.rc == 0
      changed_when: false

    - name: Recheck protected services on every replica after rolling restarts
      ansible.builtin.command:
        argv: [python3, '-c', "{{ lookup('file',desk_repo_root+'/roles/desk_ui/files/ui_guard.py') }}", guard]
        stdin: '{{ hostvars[item].network_helpers_before.stdout }}'
      delegate_to: '{{ item }}'
      loop: '{{ groups["deskboxes"] }}'
      changed_when: false
