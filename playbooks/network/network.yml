---
- name: Prepare permanent LAN-only Network replicas before electing
  hosts: deskboxes
  become: true
  gather_facts: false
  any_errors_fatal: true
  roles: [desk_network]
- name: Start or refresh each Network controller without stopping other services
  hosts: deskboxes
  become: true
  gather_facts: false
  any_errors_fatal: true
  serial: 1
  tasks:
    - name: Start new replica or restart only changed controller
      ansible.builtin.systemd_service:
        name: desk-network
        enabled: true
        daemon_reload: true
        state: "{{ 'restarted' if network_restart and network_active_before.stdout == 'active' else 'started' }}"
    - name: Wait out voter restart quarantine before touching the next replica
      ansible.builtin.uri:
        url: 'http://{{ cluster_ip }}:20213/network/desk/status'
        use_proxy: false
        timeout: 3
      register: network_voter_ready
      until: network_voter_ready.json.voter_ready | default(false)
      retries: 20
      delay: 2
      changed_when: false
- name: Verify an elected collector before opening the Network route
  hosts: deskboxes
  become: true
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Wait for one native-ready majority owner
      ansible.builtin.command:
        argv: [python3, /usr/local/libexec/desk-network/verify_ready.py]
      register: network_ready
      retries: 50
      delay: 3
      until: network_ready.rc == 0
      run_once: true
      changed_when: false
    - name: Read applied dashboard membership
      ansible.builtin.slurp:
        src: /etc/desk-dashboard/config.json
      register: network_dashboard_config
    - name: Preserve applied dashboard membership and UI VIP
      ansible.builtin.set_fact:
        dashboard_members: '{{ (network_dashboard_config.content | b64decode | from_json).members }}'
        dashboard_management_vip: '{{ (network_before.stdout | from_json).vip }}'
    - name: Install the Network-aware dashboard
      ansible.builtin.include_role:
        name: desk_dashboard
    - name: Render Network card and owner badge
      ansible.builtin.template:
        src: '{{ desk_repo_root }}/roles/desk_ui/templates/index.html.j2'
        dest: /etc/desk-ui/index.html
        mode: '0644'
    - name: Install the complete route composer with Network preservation
      ansible.builtin.copy:
        src: "{{ desk_repo_root }}/roles/desk_monitoring/files/install_proxy.py"
        dest: /usr/local/libexec/desk-monitoring/install-proxy.py
        mode: '0755'
    - name: Validate HTTP and MQTT, then gracefully expose Network
      ansible.builtin.command:
        argv: [python3, /usr/local/libexec/desk-monitoring/install-proxy.py, --backend, /etc/desk-monitoring/backend.cfg, --dns-backend, /etc/desk-ui/backend.cfg, --dashboard-backend, /etc/desk-dashboard/backend.cfg, --network-backend, /etc/desk-network/backend.cfg, --reload-page]
    - name: Recheck existing services and VIPs
      ansible.builtin.command:
        argv: [python3, '-c', "{{ lookup('file',desk_repo_root+'/roles/desk_ui/files/ui_guard.py') }}", guard]
        stdin: '{{ network_before.stdout }}'
      changed_when: false
