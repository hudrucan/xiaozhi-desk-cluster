---
# Explicitly enable the existing Settings service's all-node key provisioning.
# This deploys neither providers nor workers and does not change Cloud Config.
- name: Validate every secret-provisioning control plane before any host mutation
  hosts: xiaozhi_control_planes
  become: true
  gather_facts: true
  gather_subset: [min]
  any_errors_fatal: true
  vars_files: [../../../vars/vault.yml]
  vars:
    xiaozhi_control_plane_secret_provisioning: true
  tasks:
    - name: Preflight all control-plane deployment inputs
      ansible.builtin.include_role:
        name: xiaozhi_control_plane
        tasks_from: preflight
        public: true
    - name: Require this explicit deployment to enable secret provisioning
      ansible.builtin.assert:
        that: xiaozhi_control_plane_secret_provisioning is sameas true
    - name: Freeze public rollout source and membership
      ansible.builtin.set_fact:
        xiaozhi_settings_secret_rollout:
          revision: "{{ xiaozhi_control_plane_revision }}"
          port: "{{ xiaozhi_control_plane_port }}"
          nodes: "{{ xiaozhi_control_plane_secret_nodes }}"
    - name: Retain only a private comparison fingerprint of key and Cloud authority
      ansible.builtin.set_fact:
        xiaozhi_settings_secret_fingerprint: "{{ {'key': vault_xiaozhi_secret_provision_key, 'folder': vault_xiaozhi_cloud_folder_id, 'manifest': vault_xiaozhi_cloud_manifest_file_id} | to_json | hash('sha256') }}"
      no_log: true
    - name: Require identical rollout inputs on all nodes
      ansible.builtin.assert:
        that: hostvars[item].xiaozhi_settings_secret_rollout == xiaozhi_settings_secret_rollout
      loop: "{{ groups['xiaozhi_control_planes'] | sort }}"
      run_once: true
    - name: Require the same transfer key and Cloud authority on all nodes
      ansible.builtin.assert:
        that: hostvars[item].xiaozhi_settings_secret_fingerprint == xiaozhi_settings_secret_fingerprint
        quiet: true
      loop: "{{ groups['xiaozhi_control_planes'] | sort }}"
      run_once: true
      no_log: true

- name: Deploy symmetric Settings key provisioning one node at a time
  hosts: xiaozhi_control_planes
  become: true
  gather_facts: true
  gather_subset: [min]
  serial: 1
  any_errors_fatal: true
  vars_files: [../../../vars/vault.yml]
  vars:
    xiaozhi_control_plane_secret_provisioning: true
  roles: [xiaozhi_control_plane]

- name: Verify shared desired state and provisioning capability after rollout
  hosts: xiaozhi_control_planes
  become: true
  gather_facts: false
  any_errors_fatal: true
  vars:
    xiaozhi_control_plane_secret_provisioning: true
  tasks:
    - name: Verify the three existing control-plane backends
      ansible.builtin.include_role:
        name: xiaozhi_control_plane
        tasks_from: verify_cluster
      run_once: true
      when: not ansible_check_mode
    - name: Require enabled secret capability on every backend
      ansible.builtin.assert:
        that: item.json.capabilities.secret_provisioning | default(false) is sameas true
        quiet: true
      loop: "{{ xiaozhi_control_plane_cluster_status.results }}"
      run_once: true
      no_log: true
      when: not ansible_check_mode
