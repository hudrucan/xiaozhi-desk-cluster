---
- name: Deploy admission-aware source without changing runtime bundles
  hosts: deskboxes
  become: true
  gather_facts: false
  serial: 1
  any_errors_fatal: true
  vars:
    server_sha: "{{ xiaozhi_maintenance_server_revision }}"
    gateway_sha: "{{ xiaozhi_maintenance_gateway_revision }}"
  tasks:
    - name: Require explicit reviewed immutable source revisions
      ansible.builtin.assert:
        that:
          - server_sha is match('^[0-9a-f]{40}$')
          - gateway_sha is match('^[0-9a-f]{40}$')
    - name: Require idle worker/core/gateway before source activation
      ansible.builtin.command:
        argv: [/usr/bin/python3, '-c', "import json,urllib.request,pathlib; a=json.load(open('/run/xiaozhi-worker/activity.json')); assert all(a[k]==0 for k in ('asr','llm','tts')); c=json.load(urllib.request.urlopen('http://{{ cluster_ip }}:8000/status',timeout=4)); g=json.load(urllib.request.urlopen('http://{{ cluster_ip }}:8007/status',timeout=4)); assert c['active_sessions']==0 and c['worker_rpc']['inflight']==0 and c['tts']['inflight']==0 and g['active_mqtt_connections']==0; print('Idle confirmed')"]
      changed_when: false
    - name: Freeze current source and unchanged runtime credentials
      ansible.builtin.command:
        argv: [/usr/bin/python3, '-', preflight, "{{ server_sha }}", "{{ item }}"]
        stdin: "{{ lookup('ansible.builtin.file', desk_repo_root + '/roles/xiaozhi_vision/files/source_rollout.py') }}"
      loop: [xiaozhi-worker, xiaozhi-core]
      register: freeze
      until: freeze.rc == 0
      retries: 40
      delay: 2
      changed_when: false
    - name: Stage immutable source with unchanged dependencies
      ansible.builtin.command:
        argv: [/usr/bin/python3, '-', stage, "{{ server_sha }}", "{{ item }}"]
        stdin: "{{ lookup('ansible.builtin.file', desk_repo_root + '/roles/xiaozhi_vision/files/source_rollout.py') }}"
      loop: [xiaozhi-worker, xiaozhi-core]
      changed_when: true
    - name: Stage dependency-matched gateway source
      ansible.builtin.command:
        argv: [/usr/bin/python3, '-', stage, "{{ gateway_sha }}"]
        stdin: "{{ lookup('ansible.builtin.file', desk_repo_root + '/roles/desk_maintenance_source/files/gateway_source.py') }}"
      changed_when: true
    - name: Activate worker then core with rollback on readiness failure
      ansible.builtin.include_tasks: "{{ desk_repo_root }}/roles/desk_maintenance_source/tasks/activate.yml"
      loop: [xiaozhi-worker, xiaozhi-core]
      loop_control: {loop_var: runtime_unit}
    - name: Activate gateway and require readiness
      block:
        - ansible.builtin.command:
            argv: [/usr/bin/python3, '-', activate, "{{ gateway_sha }}"]
            stdin: "{{ lookup('ansible.builtin.file', desk_repo_root + '/roles/desk_maintenance_source/files/gateway_source.py') }}"
        - ansible.builtin.command:
            argv: [/usr/bin/python3, '-', ready, "{{ gateway_sha }}"]
            stdin: "{{ lookup('ansible.builtin.file', desk_repo_root + '/roles/desk_maintenance_source/files/gateway_source.py') }}"
          register: gateway_ready
          until: gateway_ready.rc == 0
          retries: 15
          delay: 2
          changed_when: false
      rescue:
        - ansible.builtin.command:
            argv: [/usr/bin/python3, '-', rollback, "{{ gateway_sha }}"]
            stdin: "{{ lookup('ansible.builtin.file', desk_repo_root + '/roles/desk_maintenance_source/files/gateway_source.py') }}"
        - ansible.builtin.fail: {msg: Gateway failed and previous runtime was restored}
