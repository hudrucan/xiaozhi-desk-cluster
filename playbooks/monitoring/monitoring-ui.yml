---
- name: Update only the Beszel hub UI one node at a time
  hosts: desk_monitoring
  become: true
  gather_facts: false
  serial: 1
  any_errors_fatal: true
  tasks:
    - name: Freeze protected production services and DNS configuration
      ansible.builtin.command:
        argv: [python3, '-c', "{{ lookup('file', desk_repo_root + '/roles/desk_ui/files/ui_guard.py') }}", freeze]
      register: monitoring_ui_guard
      changed_when: false
      no_log: true

    - ansible.builtin.include_role:
        name: desk_monitoring
        tasks_from: build-ui
        public: true

    - name: Switch the existing hub unit to the patched binary
      ansible.builtin.replace:
        path: /etc/systemd/system/beszel-hub.service
        regexp: '^ExecStart=/opt/desk-monitoring/{{ desk_monitoring_version | regex_escape }}/beszel(?:-desk-ui)? serve '
        replace: 'ExecStart=/opt/desk-monitoring/{{ desk_monitoring_version }}/beszel-desk-ui serve '
        backup: true
      register: monitoring_ui_unit

    - name: Restart and verify only a changed Beszel hub
      block:
        - ansible.builtin.systemd_service:
            name: beszel-hub
            state: restarted
            daemon_reload: true
          when: monitoring_ui_unit.changed or desk_monitoring_ui_binary.changed
        - name: Require the patched executable in the running unit
          ansible.builtin.command:
            argv: [systemctl, show, beszel-hub, --property=ExecStart, --value]
          register: monitoring_ui_exec
          failed_when: "'/beszel-desk-ui serve' not in monitoring_ui_exec.stdout"
          changed_when: false
        - name: Require native hub health
          ansible.builtin.uri:
            url: 'http://{{ cluster_ip }}:8090/api/health'
            use_proxy: false
            timeout: 3
          register: monitoring_ui_health
          until: monitoring_ui_health.status == 200
          retries: 20
          delay: 2
          changed_when: false
        - name: Require shared configuration to remain fully synced
          ansible.builtin.uri:
            url: 'http://{{ cluster_ip }}:8092/api/desk-config/status'
            use_proxy: false
            timeout: 4
          register: monitoring_ui_sync
          until: monitoring_ui_sync.status == 200 and monitoring_ui_sync.json.ready_nodes | length == 3 and monitoring_ui_sync.json.apply_error == None
          retries: 20
          delay: 2
          changed_when: false
      rescue:
        - name: Restore the previous unit when its executable path changed
          ansible.builtin.copy:
            src: '{{ monitoring_ui_unit.backup_file }}'
            dest: /etc/systemd/system/beszel-hub.service
            remote_src: true
          when: monitoring_ui_unit.backup_file is defined
        - name: Restore the previous patched binary on an update
          ansible.builtin.copy:
            src: '{{ desk_monitoring_ui_binary.backup_file }}'
            dest: '/opt/desk-monitoring/{{ desk_monitoring_version }}/beszel-desk-ui'
            remote_src: true
            mode: '0755'
          when: desk_monitoring_ui_binary.backup_file is defined
        - ansible.builtin.systemd_service:
            name: beszel-hub
            state: restarted
            daemon_reload: true
        - ansible.builtin.fail:
            msg: Beszel UI rollout failed; the previous hub executable was restored.

    - name: Verify protected services and DNS configuration unchanged
      ansible.builtin.command:
        argv: [python3, '-c', "{{ lookup('file', desk_repo_root + '/roles/desk_ui/files/ui_guard.py') }}", guard]
        stdin: '{{ monitoring_ui_guard.stdout }}'
      changed_when: false
      no_log: true
