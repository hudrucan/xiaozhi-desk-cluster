---
# Opt-in monitoring; never imported by site.yml. Histories remain local.
- name: Freeze the cluster before installing independent monitoring hubs
  hosts: desk_monitoring
  become: true
  gather_facts: true
  any_errors_fatal: true
  tasks:
    - ansible.builtin.include_role:
        name: desk_monitoring
        tasks_from: preflight
        public: true
    - name: Require a single shared existing ingress VIP
      ansible.builtin.assert:
        that: groups['desk_monitoring'] | map('extract', hostvars, 'desk_monitoring_vip') | unique | list | length == 1
      run_once: true
    - name: Load ignored bootstrap credentials without exposing them
      ansible.builtin.set_fact:
        desk_monitoring_credentials: "{{ lookup('ansible.builtin.file', desk_repo_root + '/secret/desk-monitoring.json') | from_json }}"
      no_log: true
      when: not ansible_check_mode
    - name: Build the symmetric private agent membership
      ansible.builtin.set_fact:
        desk_monitoring_nodes: "{{ desk_monitoring_nodes | default({}) | combine({item: hostvars[item].cluster_ip}) }}"
      loop: "{{ groups['desk_monitoring'] | sort }}"
- name: Install private hubs with isolated databases one node at a time
  hosts: desk_monitoring
  become: true
  gather_facts: false
  serial: 1
  any_errors_fatal: true
  tasks:
    - ansible.builtin.include_role:
        name: desk_monitoring
        tasks_from: hub
- name: Connect each agent to all three independent hubs
  hosts: desk_monitoring
  become: true
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - ansible.builtin.include_role:
        name: desk_monitoring
        tasks_from: agent
- name: Prepare shared monitoring settings only when explicitly enabled
  hosts: desk_monitoring
  become: true
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Require an explicit initial source before enabling shared settings
      ansible.builtin.assert:
        that: desk_monitoring_sync_source in groups['desk_monitoring']
      when: desk_monitoring_sync_enabled | bool
    - name: Prepare private config trust and encrypted seed without rotating existing secrets
      ansible.builtin.command:
        argv: ["{{ ansible_playbook_python }}", scripts/create-monitoring-sync-secret.py, --root, "{{ desk_repo_root }}", --source, "{{ desk_monitoring_sync_source }}", --management, "{{ hostvars[desk_monitoring_sync_source].ansible_host }}", --admin-email, "{{ desk_monitoring_auto_login_email }}"]
        chdir: "{{ desk_repo_root }}"
      delegate_to: localhost
      become: false
      run_once: true
      register: desk_monitoring_shared_seed
      changed_when: desk_monitoring_shared_seed.stdout == 'created'
      when: desk_monitoring_sync_enabled | bool and not ansible_check_mode
    - name: Load existing ignored config sync credentials without displaying them
      ansible.builtin.set_fact:
        desk_monitoring_sync_credentials: "{{ lookup('ansible.builtin.file', desk_repo_root + '/secret/desk-monitoring-sync.json') | from_json }}"
      no_log: true
      when: desk_monitoring_sync_enabled | bool and not ansible_check_mode
- name: Install shared settings serially before switching the monitoring frontend
  hosts: desk_monitoring
  become: true
  gather_facts: false
  serial: 1
  any_errors_fatal: true
  tasks:
    - ansible.builtin.include_role:
        name: desk_monitoring
        tasks_from: config-sync
      when: desk_monitoring_sync_enabled | bool
- name: Expose monitoring behind the existing management frontend
  hosts: desk_monitoring
  become: true
  gather_facts: false
  serial: 1
  any_errors_fatal: true
  tasks:
    - ansible.builtin.include_role:
        name: desk_monitoring
        tasks_from: proxy
- name: Verify protected services after the trial rollout
  hosts: desk_monitoring
  become: true
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Require unchanged runtime PIDs, DNS role and non-monitoring configuration
      ansible.builtin.command:
        argv: [/usr/bin/python3, '-c', "{{ lookup('ansible.builtin.file', desk_repo_root + '/roles/desk_monitoring/files/monitoring_probe.py') }}", guard, --private, "{{ cluster_ip }}", --vip, "{{ desk_monitoring_vip }}", --after-proxy]
        stdin: "{{ desk_monitoring_snapshot | to_json }}"
      changed_when: false
      check_mode: false
