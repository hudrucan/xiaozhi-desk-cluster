[package]
name = "desk-checkpoint"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false

[dependencies]
anyhow = "1.0"
base64 = "0.22"
flate2 = { version = "1.1", default-features = false, features = ["zlib"] }
libc = "0.2"
rusqlite = { version = "0.32", features = ["backup", "hooks"] }
serde_json = "1.0"
signal-hook = "0.3"
tempfile = "3.19"

[profile.release]
strip = true
