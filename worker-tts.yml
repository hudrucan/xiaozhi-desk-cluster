---
# Explicit opt-in; --limit deskb2x supports a canary. All Cloud nodes are checked.
- name: Freeze validated shared Cloud desired state before any segment TTS worker changes
  hosts: xiaozhi_workers
  become: true
  gather_facts: false
  any_errors_fatal: true
  vars_files: [vars/vault.yml]
  vars:
    xiaozhi_worker_llm_enabled: true
    xiaozhi_worker_asr_enabled: true
    xiaozhi_worker_tts_enabled: true
    xiaozhi_worker_revision: "{{ xiaozhi_worker_tts_revision }}"
    xiaozhi_worker_root: "/opt/xiaozhi-worker-tts/releases/{{ xiaozhi_worker_revision }}"
  tasks:
    - name: Require an explicit reviewed source SHA before any rollout work
      ansible.builtin.assert:
        that: xiaozhi_worker_tts_revision | default(none) is string and xiaozhi_worker_tts_revision is match('^[0-9a-f]{40}$')
        fail_msg: Set xiaozhi_worker_tts_revision to the committed and pushed reviewed server SHA.
    - name: Preflight selected workers without host mutation
      ansible.builtin.include_role:
        name: xiaozhi_worker
        tasks_from: llm_preflight
        public: true
    - name: Validate immutable controller TTS assets before any mutation
      ansible.builtin.include_role:
        name: xiaozhi_worker
        tasks_from: tts_preflight
        public: true
    - name: Require one frozen desired revision across the selected rollout
      ansible.builtin.assert:
        that:
          - hostvars[item].xiaozhi_worker_llm_expected_revision == xiaozhi_worker_llm_expected_revision
          - hostvars[item].xiaozhi_worker_tts_assets.fingerprint == xiaozhi_worker_tts_assets.fingerprint
      loop: "{{ ansible_play_hosts_all | sort }}"
      run_once: true

- name: Upgrade the compatible panel reader before activating TTS telemetry
  hosts: xiaozhi_workers
  become: true
  gather_facts: false
  serial: 1
  any_errors_fatal: true
  vars:
    xiaozhi_panel_worker_activity_enabled: true
  roles: [xiaozhi_panel]

- name: Deploy combined ASR/LLM/TTS workers one node at a time
  hosts: xiaozhi_workers
  become: true
  gather_facts: true
  gather_subset: [min]
  serial: 1
  any_errors_fatal: true
  vars_files: [vars/vault.yml]
  vars:
    xiaozhi_worker_llm_enabled: true
    xiaozhi_worker_asr_enabled: true
    xiaozhi_worker_tts_enabled: true
    xiaozhi_worker_revision: "{{ xiaozhi_worker_tts_revision }}"
    xiaozhi_worker_root: "/opt/xiaozhi-worker-tts/releases/{{ xiaozhi_worker_revision }}"
  roles: [xiaozhi_worker]

- name: Require rollout Cloud revision to remain unchanged
  hosts: xiaozhi_workers
  become: true
  gather_facts: false
  any_errors_fatal: true
  vars:
    xiaozhi_worker_llm_enabled: true
    xiaozhi_worker_asr_enabled: true
    xiaozhi_worker_tts_enabled: true
    xiaozhi_worker_revision: "{{ xiaozhi_worker_tts_revision }}"
    xiaozhi_worker_root: "/opt/xiaozhi-worker-tts/releases/{{ xiaozhi_worker_revision }}"
  tasks:
    - name: Recheck all Cloud nodes against the frozen worker revision
      ansible.builtin.include_role:
        name: xiaozhi_worker
        tasks_from: llm_preflight
    - name: Recheck frozen controller assets at rollout completion
      ansible.builtin.include_role:
        name: xiaozhi_worker
        tasks_from: tts_preflight
    - name: Recheck each selected targeted TTS subscriber
      ansible.builtin.include_role:
        name: xiaozhi_worker
        tasks_from: tts_verify
      when: not ansible_check_mode
