---
cluster_interface: end0
cluster_connection: cluster-lan

# Secret values are supplied only by the encrypted Vault file.
nats_client_password: "{{ vault_nats_client_password }}"
nats_route_password: "{{ vault_nats_route_password }}"

# Trial accepted: preserve /monitor/ on ingress reruns; installation remains opt-in.
xiaozhi_ingress_monitoring_enabled: true
# Shared LAN entrypoint; anonymous full administration explicitly requested.
xiaozhi_ingress_unified_ui_enabled: true
desk_dns_ui_auth_enabled: false
desk_dns_ui_vip_proxy_only: true
desk_monitoring_auto_login_email: admin@desk.cluster
desk_dns_client_identity_enabled: true

# IPv6 resolver shares the DNS VIP election; router DNS is configured manually.
desk_dns_ipv6_vip_enabled: true

# Authorized fail-open DNS during a total AdGuard backend outage.
desk_dns_emergency_enabled: true
desk_dns_serialized_updates: true

# Shared Beszel config; this source seeds once and is not a permanent leader.
desk_monitoring_sync_enabled: true
desk_monitoring_sync_source: deskb1x

# Native readiness probes retain the existing checks and VRRP timing.
desk_healthcheck_native_enabled: true

# Read-only overview at the shared management VIP; metadata stays in RAM.
desk_dashboard_enabled: true
desk_dashboard_client_url: http://192.168.1.128:8080/

# Explicit same-origin, confirmed per-node reboot actions; telemetry stays read-only.
desk_node_control_enabled: true
desk_node_control_port: 8011

# Combined workers are deployed; retain activity icons on panel-only reruns.
xiaozhi_panel_worker_activity_enabled: true

# Independent wg-easy UI replicas behind the shared dashboard ingress.
desk_vpn_ui_enabled: true

# New Beszel sessions prefer a stable lightly loaded hub; cookies retain existing sessions.
desk_monitoring_load_aware_enabled: true

# One LAN-only discovery owner; replicated checkpoints on all three nodes.
desk_network_enabled: true

# Owner-only recording sessions after the Guess canary; dedicated cutover only.
# The live-only Makeup camera stays outside recording authority.
desk_camera_recording_owner_workloads:
  - tapo_c222_160
  - tapo_c222_163

# Owner selects a lightweight scan worker through node-specific Core NATS subjects.
desk_network_scan_enabled: true
# All replicas retain imports while standby; only the leased owner runs native jobs.
desk_network_warm_nodes: [deskb1x, deskb2x, deskb3x]

# Native Core HA, single-active; independent device workers are a later phase.
desk_homeassistant_enabled: true
