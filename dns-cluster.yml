---
- name: Freeze all-node DNS topology and protect Xiaozhi
  hosts: desk_dns
  become: true
  gather_facts: true
  any_errors_fatal: true
  vars:
    desk_dns_verify_only: true
  tasks:
    - ansible.builtin.include_role:
        name: desk_dns
        tasks_from: preflight
        public: true
    - name: Require explicitly enabled real client forwarding
      ansible.builtin.assert:
        that: desk_dns_client_identity_enabled
    - name: Load existing ignored DNS peer credentials
      ansible.builtin.include_vars:
        file: secret/desk-dns-sync.json
      no_log: true

- name: Install every private backend before changing any DNS frontend
  hosts: desk_dns
  become: true
  gather_facts: false
  serial: 1
  any_errors_fatal: true
  tasks:
    - ansible.builtin.include_role:
        name: desk_dns
        tasks_from: cluster-backend

- name: Switch DNS and unified UI serially with backend verification
  hosts: desk_dns
  become: true
  gather_facts: false
  serial: 1
  any_errors_fatal: true
  tasks:
    - ansible.builtin.include_role:
        name: desk_dns
        tasks_from: cluster-frontend

- name: Verify unified cluster DNS and protected Xiaozhi state
  hosts: desk_dns
  become: true
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - ansible.builtin.include_role:
        name: desk_dns
        tasks_from: cluster-verify
